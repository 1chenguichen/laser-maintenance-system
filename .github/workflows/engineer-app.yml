name: Engineer App CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/engineer-app/**'
      - 'packages/shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/engineer-app/**'
      - 'packages/shared/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engineer-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/engineer-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
