name: Flutter engineer pilot
on:
  workflow_dispatch:
  push:
    branches: ['codex/flutter-engineer-*']
    paths: ['apps/engineer-flutter/**', '.github/workflows/flutter-engineer.yml', '.github/scripts/setup_flutter.py']
permissions:
  contents: read
concurrency:
  group: flutter-engineer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/engineer-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 ../../.github/scripts/setup_flutter.py
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: engineer-flutter-android
          path: apps/engineer-flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/engineer-flutter
    steps:
      - uses: actions/checkout@v4
      - run: python3 ../../.github/scripts/setup_flutter.py
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Package ordinary sandbox release for TrollStore
        run: |
          set -euo pipefail
          mkdir -p build/trollstore/Payload
          cp -R build/ios/iphoneos/Runner.app build/trollstore/Payload/
          find build/trollstore/Payload/Runner.app -type d -name '*.framework' -depth -exec codesign --force --sign - {} \;
          codesign --force --sign - build/trollstore/Payload/Runner.app
          codesign --verify --deep --strict build/trollstore/Payload/Runner.app
          cd build/trollstore
          zip -qr engineer-flutter-0.2.0-trollstore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: engineer-flutter-ios-trollstore
          path: apps/engineer-flutter/build/trollstore/engineer-flutter-0.2.0-trollstore.ipa
