name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
