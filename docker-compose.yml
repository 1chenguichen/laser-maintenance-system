version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laser_postgres
    environment:
      POSTGRES_DB: laser_maintenance
      POSTGRES_USER: laser_user
      POSTGRES_PASSWORD: laser_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laser_user -d laser_maintenance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
