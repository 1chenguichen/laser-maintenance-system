<style>
        body { background-color: #f7f9fb; } /* Enforce surface background */
        .voucher-card {
            background-color: #ffffff;
            border: 1px solid #c3c6d1;
            border-radius: 0.25rem;
        }
        .dashed-divider {
            border-bottom: 1px dashed #c3c6d1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md antialiased pb-[180px]">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-container-padding h-14 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-on-tertiary-fixed-variant fixed top-0">
<button class="flex items-center justify-center p-2 text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-tertiary-container active:opacity-80 transition-opacity rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-primary dark:text-primary-fixed">账单详情确认</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-[80px] px-container-padding max-w-[414px] mx-auto space-y-item-gap">
<!-- Hero Section: Total Amount -->
<section class="voucher-card p-container-padding text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-unit">待支付金额</p>
<div class="font-display-total text-display-total flex items-baseline justify-center text-on-surface">
<span class="text-xl mr-1" style="color: rgb(0, 0, 0);">¥</span>
<span class="">680.00</span>
</div>
</section>
<!-- Fee Details Section -->
<section class="voucher-card">
<div class="px-container-padding py-3 border-b border-outline-variant bg-surface-bright">
<h2 class="font-body-md text-body-md font-semibold text-primary">费用明细</h2>
</div>
<div class="p-container-padding space-y-3">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">上门检测费</span>
<span class="font-label-mono text-label-mono text-on-surface font-semibold">¥ 150.00</span>
</div>
<div class="dashed-divider"></div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">耗材：聚焦保护镜片 x 2</span>
<span class="font-label-mono text-label-mono text-on-surface font-semibold">¥ 400.00</span>
</div>
<div class="dashed-divider"></div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">维修工时费</span>
<span class="font-label-mono text-label-mono text-on-surface font-semibold">¥ 250.00</span>
</div>
<div class="dashed-divider"></div>
<div class="flex justify-between items-center bg-[#e8f0fe] border border-[#b4c5ff] p-2 rounded" style="background-color: rgb(230, 247, 255); border-color: rgb(145, 213, 255);">
<span class="font-body-sm text-body-sm text-[#003da6] font-medium flex items-center" style="color: rgb(24, 144, 255);">
<span class="material-symbols-outlined text-sm mr-1" data-icon="verified">verified</span>
                        [主板在保内] 减免
                    </span>
<span class="font-label-mono text-label-mono text-[#003da6] font-bold" style="color: rgb(24, 144, 255);">- ¥ 120.00</span>
</div>
</div>
</section>
<!-- Payment Methods -->
<section class="voucher-card">
<div class="px-container-padding py-3 border-b border-outline-variant bg-surface-bright">
<h2 class="font-body-md text-body-md font-semibold text-primary">支付方式</h2>
</div>
<div class="p-container-padding">
<label class="flex items-center justify-between p-3 border border-primary-container/20 rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors" style="border-color: rgb(24, 144, 255); background-color: rgb(230, 247, 255);">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#0052d9]" data-icon="chat" style="font-variation-settings: &quot;FILL&quot; 1; color: rgb(24, 144, 255);">chat</span>
<div>
<p class="font-body-md text-body-md text-on-surface">微信支付</p>
<p class="font-label-mono text-label-mono text-on-surface-variant">(企业公户结算)</p>
</div>
</div>
<input checked="" class="form-radio text-primary h-5 w-5 focus:ring-primary border-outline" name="payment_method" type="radio" style="color: rgb(24, 144, 255); accent-color: rgb(24, 144, 255);">
</label>
</div>
</section>
</main>
<!-- Sticky Footer -->
<div class="fixed bottom-[80px] w-full bg-surface border-t border-outline-variant p-container-padding pb-safe max-w-[414px] left-1/2 -translate-x-1/2 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full bg-[#0052d9] hover:bg-[#003da6] active:bg-[#003366] text-white rounded-lg py-3 flex items-center justify-center gap-2 transition-colors duration-150 shadow-[inset_0_-2px_4px_rgba(0,0,0,0.1)] active:shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]" style="background-color: rgb(24, 144, 255); box-shadow: rgba(24, 144, 255, 0.35) 0px 4px 12px;">
<span class="material-symbols-outlined" data-icon="chat" style="font-variation-settings: &quot;FILL&quot; 1;">chat</span>
<span class="font-body-md text-body-md font-semibold">确认账单并支付 ¥ 680.00</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full bg-surface border-t border-outline-variant z-50 flex justify-around items-center h-[80px] pb-safe max-w-[414px] left-1/2 -translate-x-1/2">
<a class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="font-label-mono text-[10px] font-medium">首页</span>
</a>
<a class="flex flex-col items-center justify-center w-full h-full text-primary transition-colors relative" href="#" style="color: rgb(24, 144, 255);">
<div class="absolute top-1 w-12 h-8 bg-[#dbe1ff] rounded-full opacity-60 -z-10" style="background-color: rgb(230, 247, 255); opacity: 1;"></div>
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="receipt_long" style="font-variation-settings: &quot;FILL&quot; 1;">receipt_long</span>
<span class="font-label-mono text-[10px] font-medium">工单</span>
</a>
<a class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="font-label-mono text-[10px] font-medium">我的</span>
</a>
</nav>
