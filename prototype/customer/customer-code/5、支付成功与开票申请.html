<script>
        // Simple micro-interaction for the input field to simulate 'financial context' feel
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('invoice-title');
            const icon = inputField.previousElementSibling;

            inputField.addEventListener('focus', () => {
                icon.classList.remove('text-outline');
                icon.classList.add('text-primary');
            });

            inputField.addEventListener('blur', () => {
                icon.classList.remove('text-primary');
                icon.classList.add('text-outline');
            });
        });
    </script>
