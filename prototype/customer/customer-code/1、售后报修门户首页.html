<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile constrained view for testing */
        body {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-color: #f7f9fb; /* surface */

<body class="bg-surface text-on-surface antialiased pt-14 pb-20 font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-14 bg-surface border-b border-outline-variant max-w-[414px]">
<button class="text-primary active:opacity-80 transition-opacity" style="color: rgb(24, 144, 255);">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary" style="color: rgb(17, 24, 39);">设备报修门户</h1>
<button class="text-primary active:opacity-80 transition-opacity" style="color: rgb(24, 144, 255);">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="px-container-padding py-section-margin space-y-section-margin">
<!-- Hero Section: Scan Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center space-y-4 shadow-sm active:scale-[0.98] transition-transform cursor-pointer relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full flex items-center justify-center bg-surface-container"><span class="material-symbols-outlined text-3xl text-on-surface" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 0; color: #000000;">qr_code_scanner</span></div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">扫码识别机身二维码</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">快速带入设备信息及质保状态</p>
</section>
<!-- Status Bar -->
<section class="rounded-xl p-3 flex items-start space-x-3 border" style="background-color: rgb(230, 247, 255); border-color: rgb(145, 213, 255);"><span class="material-symbols-outlined fill mt-0.5" data-icon="check_circle" data-weight="fill" style="color: rgb(24, 144, 255);">check_circle</span><div><p class="font-body-sm text-body-sm font-semibold" style="color: rgb(24, 144, 255);">已成功识别 SN 码：884920</p><p class="font-body-sm text-body-sm text-on-surface-variant">匹配设备：3000W 激光切割机</p></div></section>
<!-- Warranty Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm space-y-3">
<div class="flex items-center space-x-2 border-b border-outline-variant/50 pb-2">
<span class="material-symbols-outlined text-outline" data-icon="calendar_month">calendar_month</span>
<h3 class="font-body-md text-body-md font-semibold text-on-surface">质保状态</h3>
<span class="ml-auto px-2 py-1 rounded-lg font-label-mono text-label-mono border font-semibold" style="background-color: rgb(230, 247, 255); color: rgb(24, 144, 255); border-color: rgb(145, 213, 255);">部分过保</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">本次维修可能产生上门费及备件费。具体费用以工程师上门检测后出具的报价单为准。</p>
</section>
<!-- Fault Grid -->
<section class="space-y-4">
<h3 class="font-body-md text-body-md font-semibold text-on-surface flex items-center">
<span class="material-symbols-outlined text-primary mr-2" data-icon="build" style="color: rgb(24, 144, 255);">build</span>
                选择故障现象
            </h3>
<div class="grid grid-cols-3 gap-3">
<!-- Grid Items -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">不出光</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">水箱预警</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">导轨卡死</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">红光偏移</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">开机无反应</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">辅助气压低</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">焦距无法调节</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface hover:bg-surface-container-high">切割面粗糙</button>
<button class="bg-surface-container border-dashed border border-outline rounded-xl p-3 text-center active:bg-primary-fixed active:border-primary transition-colors font-body-sm text-body-sm text-on-surface-variant hover:bg-surface-container-high">其他故障</button>
</div>
</section>
<!-- Spacer for Bottom Action -->
<div class="h-16"></div>
</main>
<!-- Bottom Action (Sticky) -->
<div class="fixed bottom-16 w-full max-w-[414px] px-4 bg-surface/90 backdrop-blur py-2 z-40 border-t border-outline-variant/30"><button class="w-full text-on-primary font-medium text-sm py-2.5 rounded-lg shadow-sm active:scale-[0.98] transition-transform flex items-center justify-center space-x-1.5" style="background-color: rgb(24, 144, 255);"><span class="material-symbols-outlined text-[18px]" data-icon="send">send</span><span class="">提交报修</span></button></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest border-t border-outline-variant max-w-[414px] shadow-[0_-2px_10px_rgba(0,0,0,0.05)]"><button class="flex-1 flex flex-col items-center justify-center py-1.5 active:scale-95 transition-transform duration-150" style="color: rgb(24, 144, 255);"><span class="material-symbols-outlined fill" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span><span class="font-label-mono text-label-mono mt-1 font-semibold">首页</span></button><button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant hover:text-primary active:scale-95 transition-transform duration-150"><span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span><span class="font-label-mono text-label-mono mt-1">工单</span></button><button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant hover:text-primary active:scale-95 transition-transform duration-150"><span class="material-symbols-outlined" data-icon="person">person</span><span class="font-label-mono text-label-mono mt-1">我的</span></button></nav>
