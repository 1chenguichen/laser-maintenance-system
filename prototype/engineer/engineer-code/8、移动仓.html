<body class="bg-background text-on-background min-h-screen pb-20 pt-14">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed-dim font-headline-sm text-headline-sm docked full-width top-0 border-b border-outline-variant dark:border-outline-variant flat no shadows fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined hover:bg-surface-container-low dark:hover:bg-surface-container-low active:opacity-70 transition-opacity cursor-pointer">arrow_back</span>
</div>
<div class="font-headline-md text-headline-md text-primary">移动仓管理</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined hover:bg-surface-container-low dark:hover:bg-surface-container-low active:opacity-70 transition-opacity cursor-pointer">notifications</span>
</div>
</header>
<main class="p-margin-mobile flex flex-col gap-section-gap">
<!-- Dashboard -->
<section class="grid grid-cols-2 gap-gutter">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md flex flex-col gap-stack-sm">
<div class="font-label-md text-label-md text-on-surface-variant">SKU 种类</div>
<div class="font-display-lg text-display-lg text-primary">124</div>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md flex flex-col gap-stack-sm">
<div class="font-label-md text-label-md text-on-surface-variant">库存总值 (元)</div>
<div class="font-display-lg text-display-lg text-primary">45,280</div>
</div>
</section>
<!-- Material List -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-background">物料列表</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<!-- Item 1 -->
<div class="p-stack-md border-b border-outline-variant flex justify-between items-center last:border-b-0 min-h-[56px]">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">主板 Rev.B</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">编号: MB-2023-09</span>
</div>
<div class="flex items-center gap-stack-sm">
<span class="font-body-md text-body-md text-on-surface">数量: 12</span>
</div>
</div>
<!-- Item 2 (Low Stock) -->
<div class="p-stack-md border-b border-outline-variant flex justify-between items-center last:border-b-0 min-h-[56px] bg-error-container/20">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-error">温湿度传感器</span>
<span class="font-body-sm text-body-sm text-error/80">编号: SN-TH-01</span>
</div>
<div class="flex items-center gap-stack-sm">
<span class="font-body-md text-body-md text-error font-bold">数量: 2</span>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
<!-- Item 3 -->
<div class="p-stack-md border-b border-outline-variant flex justify-between items-center last:border-b-0 min-h-[56px]">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">锂电池组 5000mAh</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">编号: BT-5K-A</span>
</div>
<div class="flex items-center gap-stack-sm">
<span class="font-body-md text-body-md text-on-surface">数量: 45</span>
</div>
</div>
<!-- Item 4 -->
<div class="p-stack-md border-b border-outline-variant flex justify-between items-center last:border-b-0 min-h-[56px]">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">接线端子 4pin</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">编号: CN-4P-X</span>
</div>
<div class="flex items-center gap-stack-sm">
<span class="font-body-md text-body-md text-on-surface">数量: 120</span>
</div>
</div>
</div>
</section>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-margin-mobile bg-primary-container text-on-primary font-label-lg text-label-lg px-stack-md py-stack-sm rounded-full flex items-center gap-stack-sm shadow-[0_4px_12px_rgba(0,0,0,0.1)] hover:bg-primary-container/90 transition-colors z-40">
<span class="material-symbols-outlined">add</span>
        申请调拨
    </button>

<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest dark:hover:bg-surface-container-lowest active:scale-95 transition-transform duration-150 p-2 rounded cursor-pointer">

</div>

</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span>移动仓</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest dark:hover:bg-surface-container-lowest active:scale-95 transition-transform duration-150 p-2 rounded cursor-pointer">
<span class="material-symbols-outlined">person</span>
<span>我的</span>
</div>
</nav>
