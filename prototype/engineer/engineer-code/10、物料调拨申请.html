</button>
</header>

<!-- Warehouse Selection -->
<section class="flex flex-col gap-stack-md">

<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile flex flex-col gap-stack-lg">
<!-- Outbound Warehouse -->
<div class="flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors -mx-margin-mobile px-margin-mobile py-2">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-error-container text-on-error-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="output">output</span>
</div>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">调出仓库</span>
<span class="font-body-lg text-body-lg text-on-surface">上海总仓</span>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
<div class="h-px bg-outline-variant w-full"></div>
<!-- Inbound Warehouse -->
<div class="flex items-center justify-between group cursor-pointer hover:bg-surface-container-low transition-colors -mx-margin-mobile px-margin-mobile py-2">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="input">input</span>
</div>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">调入仓库 (当前)</span>

</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</div>

<button class="font-label-md text-label-md text-primary flex items-center gap-1 hover:underline">
<span class="material-symbols-outlined text-[16px]" data-icon="add_circle">add_circle</span>
                    添加物料
                </button>

<span class="material-symbols-outlined text-[20px]" data-icon="remove">remove</span>
</button>
<span class="font-body-lg text-body-lg text-on-surface w-6 text-center qty-val">5</span>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors" onclick="increment(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
</button>
</div>
</div>

<button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors" onclick="decrement(this)">

<button class="flex-1 bg-primary-container text-on-primary font-label-lg text-label-lg py-3 rounded-lg flex items-center justify-center transition-colors hover:bg-opacity-90">
                提交申请
            </button>
</div>
</div>
<script>
        function increment(btn) {
            const valSpan = btn.parentElement.querySelector('.qty-val');
            let val = parseInt(valSpan.innerText);
            valSpan.innerText = val + 1;
        }

        function decrement(btn) {
            const valSpan = btn.parentElement.querySelector('.qty-val');
            let val = parseInt(valSpan.innerText);
            if (val > 1) {
                valSpan.innerText = val - 1;
            }
        }
    </script>
