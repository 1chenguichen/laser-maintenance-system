<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>物料核销</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#303031",
                        "on-tertiary-fixed": "#011a40",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#283d64",
                        "secondary-fixed": "#e5e2e1",
                        "primary-fixed": "#66ff95",
                        "on-secondary-container": "#636262",
                        "inverse-primary": "#45e17c",
                        "tertiary": "#4a5e87",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bbcbba",
                        "on-primary-container": "#00471f",
                        "on-primary-fixed-variant": "#005225",
                        "on-surface-variant": "#3d4a3d",
                        "background": "#faf9f9",
                        "surface-bright": "#faf9f9",
                        "tertiary-fixed-dim": "#b2c6f6",
                        "surface-tint": "#006d33",
                        "surface-container-highest": "#e3e2e2",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f5f3f3",
                        "on-background": "#1b1c1c",
                        "on-surface": "#1b1c1c",
                        "error": "#ba1a1a",
                        "secondary-container": "#e2dfde",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#32466e",
                        "primary-container": "#07c160",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-container": "#efeded",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e9e8e8",
                        "surface": "#faf9f9",
                        "tertiary-container": "#94a8d6",
                        "outline": "#6c7b6c",
                        "surface-dim": "#dbdad9",
                        "primary": "#006d33",
                        "on-primary-fixed": "#00210b",
                        "secondary": "#5f5e5e",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f2f0f0",
                        "primary-fixed-dim": "#45e17c",
                        "surface-variant": "#e3e2e2",
                        "tertiary-fixed": "#d8e2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "24px",
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "section-gap": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar (Transactional - Suppress normal nav, keep app bar) -->
<header class="bg-surface border-b border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14">
<button aria-label="Back" class="text-primary hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">物料核销</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(3.5rem+16px)] pb-[calc(5rem+32px)] px-margin-mobile md:max-w-screen-md md:mx-auto w-full flex flex-col gap-stack-lg">
<!-- Info Banner -->
<div class="bg-surface-container-low p-stack-md rounded-lg flex items-start gap-stack-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-primary-container mt-1">info</span>
<p class="font-body-md text-on-surface-variant">提示：所选物料核销确认后，将自动从您的随车仓（移动仓）库存中扣减。</p>
</div>
<!-- Material List Section -->
<section class="flex flex-col gap-stack-md">
<div class="flex justify-between items-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface">已添加物料</h2>
<span class="font-label-md text-label-md text-secondary bg-surface-container py-1 px-2 rounded-full">共 2 项</span>
</div>
<!-- List Items -->
<ul class="flex flex-col gap-stack-sm">
<!-- Item 1 -->
<li class="bg-surface border border-outline-variant rounded-lg p-stack-md flex justify-between items-center group hover:bg-surface-container-lowest transition-colors">
<div class="flex flex-col gap-unit">
<h3 class="font-label-lg text-label-lg text-on-surface">3000W 镜片</h3>
<p class="font-body-sm text-on-surface-variant">编码: OP-3KW-LENS-01</p>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-md text-label-md text-primary bg-primary/10 px-2 py-0.5 rounded">库存充足</span>
<span class="font-body-sm text-on-surface-variant">数量: 1</span>
</div>
</div>
<div class="flex flex-col items-end gap-stack-sm">
<span class="font-label-lg text-label-lg text-on-surface">¥ 1,200.00</span>
<button aria-label="Delete" class="text-error opacity-70 hover:opacity-100 p-2 -mr-2 transition-opacity">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</li>
<!-- Item 2 -->
<li class="bg-surface border border-outline-variant rounded-lg p-stack-md flex justify-between items-center group hover:bg-surface-container-lowest transition-colors">
<div class="flex flex-col gap-unit">
<h3 class="font-label-lg text-label-lg text-on-surface">标准密封圈套装</h3>
<p class="font-body-sm text-on-surface-variant">编码: SEAL-STD-SET</p>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-md text-label-md text-primary bg-primary/10 px-2 py-0.5 rounded">库存充足</span>
<span class="font-body-sm text-on-surface-variant">数量: 2</span>
</div>
</div>
<div class="flex flex-col items-end gap-stack-sm">
<span class="font-label-lg text-label-lg text-on-surface">¥ 150.00</span>
<button aria-label="Delete" class="text-error opacity-70 hover:opacity-100 p-2 -mr-2 transition-opacity">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</li>
</ul>
<!-- Add More Button (Ghost Style) -->
<button class="w-full py-stack-md border border-dashed border-outline-variant rounded-lg text-secondary font-label-lg text-label-lg flex items-center justify-center gap-unit hover:bg-surface-container-low transition-colors mt-2">
<span class="material-symbols-outlined">add</span>
                继续添加物料
            </button>
</section>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-mobile flex flex-col gap-stack-md z-40 md:items-center">
<div class="w-full md:max-w-screen-md">
<!-- Search Input -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="输入物料名称或编码搜索添加" type="text">
</div>
<!-- Summary & Confirm Action -->
<div class="flex justify-between items-center mt-stack-md">
<div class="flex flex-col">
<span class="font-body-sm text-on-surface-variant">总计金额</span>
<span class="font-headline-lg-mobile md:font-headline-lg text-primary-container">¥ 1,500.00</span>
</div>
<button class="bg-primary-container text-on-primary font-label-lg text-label-lg px-6 py-3 rounded-lg hover:bg-primary transition-colors flex items-center gap-2">
                    确认并计算总价
                    <span class="material-symbols-outlined text-[18px]">calculate</span>
</button>
</div>
</div>
</div>
</body></html>
