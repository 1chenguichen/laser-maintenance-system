            font-variation-settings: 'FILL' 1;

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen pb-[80px]">
<!-- TopAppBar Shared Component -->
<header class="bg-surface border-b border-outline-variant flat no shadows fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14">
<button class="w-10 h-10 flex items-center justify-start text-primary hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 flex justify-center text-center">
<span class="font-headline-sm text-headline-sm text-on-surface">服务中心</span>
</div>
<button class="w-10 h-10 flex items-center justify-end text-primary hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-[72px] max-w-[1280px] mx-auto w-full md:px-margin-desktop">
<!-- Hero: Earnings Balance -->
<section class="px-margin-mobile py-8 flex flex-col items-center justify-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm w-full text-left">收益资产</h1>
<div class="w-full flex flex-col items-center mt-section-gap">
<span class="font-body-md text-body-md text-secondary mb-unit">总资产余额 (元)</span>
<div class="flex items-baseline gap-unit text-on-surface">
<span class="font-headline-md text-headline-md font-bold">¥</span>
<span class="font-display-lg text-display-lg tracking-tight">12,450.00</span>
</div>
<button class="mt-stack-lg bg-primary-container text-on-primary font-label-lg text-label-lg px-8 py-3 rounded-full hover:opacity-90 active:scale-95 transition-all shadow-sm">
                    去提现
                </button>
</div>
</section>
<!-- Bento Grid: Daily Stats -->
<section class="px-margin-mobile mt-section-gap">
<div class="grid grid-cols-2 gap-gutter">
<!-- Stat Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex flex-col justify-between h-[104px]">
<div class="flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span class="font-label-md text-label-md">今日完工</span>
</div>
<div class="flex items-baseline gap-1 mt-auto">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">8</span>
<span class="font-body-sm text-body-sm text-secondary">单</span>
</div>
</div>
<!-- Stat Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex flex-col justify-between h-[104px]">
<div class="flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
<span class="font-label-md text-label-md">今日入账</span>
</div>
<div class="flex items-baseline gap-1 mt-auto text-primary-container">
<span class="font-body-sm text-body-sm font-bold">¥</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">860.00</span>
</div>
</div>
</div>
</section>
<!-- Action Menu (Card Style List) -->
<section class="px-margin-mobile mt-section-gap">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<!-- Menu Item 1 -->
<button class="w-full flex items-center justify-between h-[56px] px-4 hover:bg-surface-container-low transition-colors border-b border-surface-variant active:bg-surface-dim group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">receipt_long</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">提现记录</span>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</button>
<!-- Menu Item 2 -->
<button class="w-full flex items-center justify-between h-[56px] px-4 hover:bg-surface-container-low transition-colors active:bg-surface-dim group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">银行卡管理</span>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</button>
</div>
</section>

<button class="flex flex-col items-center justify-center text-secondary font-label-md text-label-md w-16 h-12 hover:bg-surface-container-lowest transition-colors rounded-lg">

</button>
<!-- Tab 2: 任务 (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary font-label-md text-label-md w-16 h-12 hover:bg-surface-container-lowest transition-colors rounded-lg">

</button>

<button class="flex flex-col items-center justify-center text-primary font-bold font-label-md text-label-md w-16 h-12 hover:bg-surface-container-lowest active:scale-95 transition-transform duration-150 rounded-lg">
<span class="material-symbols-outlined mb-1 icon-fill">person</span>
<span>我的</span>
</button>
</nav>
