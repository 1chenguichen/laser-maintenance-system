<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">my_location</span>

</div>

<span class="material-symbols-outlined text-error text-2xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Location Details -->
<div class="bg-surface rounded-lg p-stack-md border border-outline-variant flex flex-col gap-stack-sm">
<div class="flex items-start gap-stack-sm">
<span class="material-symbols-outlined text-primary mt-1" style="font-variation-settings: 'FILL' 1;">flag</span>
<div class="flex-grow">

<p class="font-body-md text-body-md text-on-surface">某某机械厂</p>
</div>
</div>

<div class="flex-grow">
<p class="font-label-md text-label-md text-on-surface-variant">当前定位</p>
<p class="font-body-md text-body-md text-on-surface">定位中，请稍候...</p>
<p class="font-body-sm text-body-sm text-primary mt-1">已进入可签到范围</p>

</div>
</div>

</div>

<button class="w-full h-12 bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container/90 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>

        </button>
