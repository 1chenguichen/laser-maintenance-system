name: zhixiugong_engineer
description: Native Flutter engineer pilot for the existing Zhixiugong service platform.
publish_to: none
version: 0.3.0+5
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
  http_parser: ^4.1.2
  cupertino_http: 3.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
    - assets/diagnosis.webp
    - assets/avatar.webp
    - assets/service-visuals/
