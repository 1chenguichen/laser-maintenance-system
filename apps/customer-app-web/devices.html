<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script><script src="/visual-media.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的设备 · 智修工</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "warning": "#faad14",
            "error": "#ff4d4f"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: 340px;
      max-width: 90vw;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=1"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/service-experience.css"><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-media.css"><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/client-refresh.css"><script src="/client-refresh.js" defer></script><script src="/intelligent-pages.js" defer></script><link rel="stylesheet" href="/client-system.css"><link rel="stylesheet" href="/client-navigation.css"><script src="/client-feedback.js" defer></script><script src="/client-navigation.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-20 mobile-system client-devices-compact" data-role="customer" data-page="devices">
  <!-- Top App Bar -->
  <header class="client-page-header"><a class="client-back" href="home.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12 4-8 8 8 8M4 12h16" stroke-linecap="round" stroke-linejoin="round"/></svg></a><h1 class="client-header-title">我的设备</h1><button class="client-header-action" onclick="showAddModal()" aria-label="添加设备"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke-linecap="round"/></svg></button></header>

  <main class="pt-14 px-4 space-y-4">
    <section class="device-list-tools" aria-label="设备查找"><label class="device-search"><span class="material-symbols-outlined" aria-hidden="true">search</span><input id="deviceSearch" type="search" aria-label="搜索设备型号、序列号或企业" placeholder="搜索型号、SN 或服务企业"></label><a class="device-scan-shortcut" href="device-scan.html"><svg class="client-scan-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5M3 16v5h5m8 0h5v-5"/><path d="M7 7h4v4H7zm6 0h4v4h-4zM7 13h4v4H7zm6 0h2v2h2v2h-4z"/></svg>扫一扫</a></section>
    <div class="device-list-summary"><span id="deviceListCount" aria-live="polite">正在读取设备</span><button type="button" onclick="showAddModal()">绑定设备</button></div>
    <div id="deviceLoadError" role="alert" hidden></div>
    <!-- Loading -->
    <div id="loading" class="text-center py-10 text-on-surface-variant">
      <span class="material-symbols-outlined animate-spin">progress_activity</span>
      <p class="mt-2">加载中...</p>
    </div>

    <p class="visual-source-note">缩略图为设备类型参考，实物照片请进入设备档案查看。</p>
    <!-- Device List -->
    <section class="space-y-3 mt-4 hidden" id="deviceListSection">
      <div id="deviceList"></div>
    </section>

    <!-- Empty State -->
    <section class="hidden text-center py-10" id="emptyState">
      <span class="material-symbols-outlined text-5xl text-on-surface-variant">precision_manufacturing</span>
      <p class="mt-4 text-on-surface-variant">暂无设备</p>
      <p class="text-sm text-on-surface-variant mt-1">点击右上角添加设备</p>
    </section>

    <!-- Add Device Hint -->
    <section class="bg-white border border-dashed border-outline-variant rounded-xl p-6 text-center shadow-sm cursor-pointer hover:border-primary transition-colors hidden" id="addHint" onclick="showAddModal()">
      <span class="material-symbols-outlined text-3xl text-on-surface-variant">add_circle</span>
      <p class="text-sm text-on-surface-variant mt-2">添加新设备</p>
    </section>
  </main>

  <!-- Add Device Modal -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-lg">添加设备</h3>
        <button onclick="hideAddModal()" class="text-on-surface-variant hover:text-on-surface">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <p class="text-sm text-on-surface-variant mb-4">请输入设备序列号（SN码）</p>
      <input type="text" id="serialInput" class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm" placeholder="粘贴设备绑定链接，或输入已关联设备的序列号" />
      <p id="addError" class="text-error text-sm mt-2 hidden"></p>
      <button onclick="submitAddDevice()" class="w-full mt-4 py-3 bg-primary text-white rounded-lg font-medium">确认添加</button>
    </div>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="mobile-navigation" aria-label="主要导航"><a href="home.html"><span class="material-symbols-outlined" aria-hidden="true">home</span><span>首页</span></a><a href="services.html"><span class="material-symbols-outlined" aria-hidden="true">travel_explore</span><span>找服务</span></a><a href="devices.html" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">precision_manufacturing</span><span>设备</span></a><a href="market-orders.html"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span><span>订单</span></a><a href="profile.html"><span class="material-symbols-outlined" aria-hidden="true">person</span><span>我的</span></a></nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('customer_token');

    if (!token) {
      window.location.href = 'login.html?next='+encodeURIComponent('devices.html'+location.search);
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadDevices();
      var params=new URLSearchParams(location.search);var asset=params.get('asset');if(asset){location.replace('device-scan.html?asset='+encodeURIComponent(asset));return;}if(params.get('bind'))location.replace('device-scan.html');
    });

    var allDeviceRows=[];
    document.getElementById('deviceSearch').addEventListener('input',function(){renderDeviceRows()});
    function loadDevices() {
      document.getElementById('deviceLoadError').hidden=true;
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('deviceListSection').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('addHint').classList.add('hidden');

      fetch(API_BASE + '/customer/devices', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(window.readApiResponse)
        .then(function(devices) {
          document.getElementById('loading').classList.add('hidden');
          renderDevices(devices || []);
        }).catch(function(e) {
          console.error(e);
          document.getElementById('loading').classList.add('hidden');
          var problem=document.getElementById('deviceLoadError');problem.hidden=false;problem.innerHTML='设备暂未读取成功。<button type="button" onclick="loadDevices()">重新加载</button>';document.getElementById('deviceListCount').textContent='读取失败';
        });
    }

    function renderDevices(devices) {allDeviceRows=devices;renderDeviceRows()}
    function renderDeviceRows(){
      var q=document.getElementById('deviceSearch').value.trim().toLowerCase();
      var rows=allDeviceRows.filter(d=>[d.model,d.serialNumber,d.serviceName].some(v=>String(v||'').toLowerCase().includes(q)));
      var list=document.getElementById('deviceList');
      document.getElementById('deviceListCount').textContent=q?'匹配 '+rows.length+' / '+allDeviceRows.length+' 台设备':'共 '+allDeviceRows.length+' 台设备';
      document.getElementById('deviceListSection').classList.toggle('hidden',!allDeviceRows.length);
      document.getElementById('emptyState').classList.toggle('hidden',!!allDeviceRows.length);
      document.getElementById('addHint').classList.toggle('hidden',!!allDeviceRows.length);
      list.innerHTML=rows.length?rows.map(d=>{
        var warranty=getWarrantyStatus(d.warrantyExpire),id=window.escapeHtml(d.id),e=window.escapeHtml;
        return '<article class="client-device-row" data-device-kind="'+(window.VisualMedia?.deviceKey(d)||'device')+'"><div class="client-device-summary">'+(window.VisualMedia?.device(d,true)||'<span class="device-type-icon material-symbols-outlined" aria-hidden="true">precision_manufacturing</span>')+'<a class="client-device-identity" href="device-detail.html?id='+id+'"><h2>'+e(d.model||'设备型号未填写')+'</h2><p>SN '+e(d.serialNumber||'未登记')+'</p><span class="device-warranty '+(warranty==='在保'?'in-warranty':'')+'">'+e(warranty==='未知'?'保修未登记':warranty)+'</span></a></div><p class="client-device-company">服务企业 · '+e(d.serviceName||'待确认')+'</p><div class="client-device-actions"><a href="device-detail.html?id='+id+'">设备档案 <span aria-hidden="true">›</span></a><a class="client-device-repair" href="repair-form.html?deviceId='+id+'">报修</a></div></article>';
      }).join(''):'<div class="client-device-no-match"><strong>没有匹配的设备</strong><p>试试型号、序列号或服务企业名称。</p><button type="button" id="clearDeviceSearch">清除搜索</button></div>';
      var clear=document.getElementById('clearDeviceSearch');if(clear)clear.onclick=function(){document.getElementById('deviceSearch').value='';renderDeviceRows()};
    }

    function getWarrantyStatus(warrantyExpire) {
      if (!warrantyExpire) return '未知';
      var now = new Date();
      var expire = new Date(warrantyExpire);
      var monthsDiff = (expire.getFullYear() - now.getFullYear()) * 12 + (expire.getMonth() - now.getMonth());
      if (expire < now) return '已过保';
      if (monthsDiff < 3) return '部分过保';
      return '在保';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function showAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('serialInput').value = '';
      document.getElementById('addError').classList.add('hidden');
    }

    function hideAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function submitAddDevice() {
      var serial = document.getElementById('serialInput').value.trim();
      if (!serial) {
        document.getElementById('addError').textContent = '请输入设备序列号';
        document.getElementById('addError').classList.remove('hidden');
        return;
      }

      document.getElementById('addError').classList.add('hidden');

      fetch(API_BASE + '/customer/devices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ serialNumber: serial })
      }).then(window.readApiResponse)
        .then(function(data) {
          if (data.id) {
            hideAddModal();
            alert('设备添加成功！');
            loadDevices();
          } else {
            document.getElementById('addError').textContent = data.message || '添加失败';
            document.getElementById('addError').classList.remove('hidden');
          }
        }).catch(function(e) {
          document.getElementById('addError').textContent = e.message || '网络错误，请重试';
          document.getElementById('addError').classList.remove('hidden');
        });
    }

    function repairDevice(deviceId) {
      window.location.href = 'repair-form.html?deviceId=' + deviceId;
    }

    function navigateTo(page) {
      var pages = {
        'home': 'index.html',
        'orders': 'orders.html',
        'chat': 'chat.html',
        'profile': 'profile.html'
      };
      if (pages[page]) {
        window.location.href = pages[page];
      }
    }
  </script>
</body>
</html>
