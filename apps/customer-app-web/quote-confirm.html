<html lang="zh-CN">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "surface-container": "#eceef0",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "error": "#ff4d4f"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=2"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/client-refresh.css"><script src="/client-refresh.js" defer></script><link rel="stylesheet" href="/client-system.css"><link rel="stylesheet" href="/client-navigation.css"><script src="/client-feedback.js" defer></script><script src="/client-navigation.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-[180px] mobile-system" data-role="customer" data-page="quote-confirm">
  <!-- Top App Bar -->
  <header class="client-page-header"><a class="client-back" href="market-orders.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12 4-8 8 8 8M4 12h16" stroke-linecap="round" stroke-linejoin="round"/></svg></a><h1 class="client-header-title">确认报价</h1><span class="client-header-space" aria-hidden="true"></span></header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Total Amount Card -->
    <section class="bg-white border border-outline-variant rounded-xl p-6 text-center shadow-sm mt-4">
      <p class="text-sm text-on-surface-variant mb-1">报价总额</p>
      <div class="flex items-baseline justify-center">
        <span class="text-xl mr-1" style="color: #111827;">¥</span>
        <span class="text-4xl font-bold" style="color: #111827;" id="totalAmount">—</span>
      </div>
    </section>

    <!-- Fee Details -->
    <section class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
      <div class="px-4 py-3 border-b border-outline-variant bg-white">
        <h2 class="font-semibold" style="color: #1890ff;">费用明细</h2>
      </div>
      <div class="p-4 space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-sm text-on-surface-variant">配件费用</span>
          <span class="font-mono text-sm font-semibold" id="partsFee">—</span>
        </div>
        <div class="border-b border-dashed border-outline-variant"></div>
        <div class="flex justify-between items-center">
          <span class="text-sm text-on-surface-variant">维修工时费</span>
          <span class="font-mono text-sm font-semibold" id="laborFee">—</span>
        </div>
        <div class="border-b border-dashed border-outline-variant"></div>
      </div>
    </section>

    <!-- Payment Method -->
    <section class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
      <div class="px-4 py-3 border-b border-outline-variant bg-white">
        <h2 class="font-semibold" style="color: #1890ff;">后续支付说明</h2>
      </div>
      <div class="p-4">
        <label class="flex items-center justify-between p-3 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors" style="border: 1px solid #1890ff; background-color: #e6f7ff;">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined fill" style="color: #1890ff;">chat</span>
            <div>
              <p class="font-medium" style="color: #111827;">确认后支付30%定金</p>
              <p class="text-xs text-on-surface-variant">当前为本地模拟支付流程</p>
            </div>
          </div>
          <input checked class="form-radio h-5 w-5" style="accent-color: #1890ff;" type="radio" name="payment_method">
        </label>
      </div>
    </section>

    <!-- Order Info -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-2" style="color: #111827;">工单信息</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工单编号</span>
          <span class="font-mono" id="orderNo">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">设备型号</span>
          <span id="deviceModel">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工程师</span>
          <span id="engineerName">—</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Sticky Footer -->
  <div class="fixed bottom-[80px] w-full max-w-[414px] left-1/2 -translate-x-1/2 bg-white border-t border-outline-variant px-4 py-4 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <button data-ui="primary" id="payBtn" disabled class="w-full py-3 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition-colors shadow-md" style="background-color: #1890ff;" onclick="confirmPayment()">
      <span class="material-symbols-outlined fill">chat</span>
      <span>确认报价 <span id="payAmount">—</span></span>
    </button>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="mobile-navigation" aria-label="主要导航"><a href="home.html"><span class="material-symbols-outlined" aria-hidden="true">home</span><span>首页</span></a><a href="services.html"><span class="material-symbols-outlined" aria-hidden="true">travel_explore</span><span>找服务</span></a><a href="devices.html"><span class="material-symbols-outlined" aria-hidden="true">precision_manufacturing</span><span>设备</span></a><a href="market-orders.html" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span><span>订单</span></a><a href="profile.html"><span class="material-symbols-outlined" aria-hidden="true">person</span><span>我的</span></a></nav>

  <script>
    var API_BASE=window.APP_API_BASE,token=localStorage.getItem('customer_token');
    var orderId=location.hash.slice(1)||new URLSearchParams(location.search).get('id');
    var orderData=null,submitting=false;
    if(!token) location.href='login.html';
    function text(id,value){document.getElementById(id).textContent=value;}
    function eligible(data){var total=Number(data.partsFee||0)+Number(data.laborFee||0);return data.status==='PENDING_PAYMENT'&&!data.customerConfirm&&Number.isFinite(total)&&(total>0||(total===0&&data.contractId));}
    function resetQuote(){orderData=null;document.getElementById('payBtn').disabled=true;['totalAmount','payAmount','partsFee','laborFee','deviceModel','orderNo','engineerName'].forEach(id=>text(id,'—'));}
    async function loadQuoteDetail(){
      resetQuote();
      if(!/^[a-f0-9-]{36}$/i.test(orderId||'')){ClientFeedback.show('缺少有效工单编号，请从订单详情进入');return;}
      ClientFeedback.show('正在读取报价…','loading');
      try{
        var data=await fetch(API_BASE+'/customer/work-orders/'+encodeURIComponent(orderId),{headers:{Authorization:'Bearer '+token}}).then(window.readApiResponse);
        var parts=Number(data.partsFee||0),labor=Number(data.laborFee||0);
        if(!Number.isFinite(parts)||!Number.isFinite(labor)||parts<0||labor<0)throw new Error('报价金额异常');
        orderData=data;text('totalAmount',(parts+labor).toFixed(2));text('payAmount','¥ '+(parts+labor).toFixed(2));text('partsFee','¥ '+parts.toFixed(2));text('laborFee','¥ '+labor.toFixed(2));text('deviceModel',data.device?.model||'—');text('orderNo',data.orderNo||'—');text('engineerName',data.engineer?.name||'—');
        document.getElementById('payBtn').disabled=!eligible(data);
        if(eligible(data))ClientFeedback.clear();else ClientFeedback.show('当前工单无需确认报价，请返回工单查看进度','loading');
      }catch(e){resetQuote();ClientFeedback.show('报价读取失败：'+e.message,'error',loadQuoteDetail);}
    }
    async function confirmPayment(){
      if(submitting||!orderData||!eligible(orderData))return;
      submitting=true;var button=document.getElementById('payBtn');button.disabled=true;button.setAttribute('aria-busy','true');
      try{await fetch(API_BASE+'/customer/work-orders/'+encodeURIComponent(orderId)+'/confirm',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({confirm:true})}).then(window.readApiResponse);location.href='order-progress.html#'+orderId;}
      catch(e){ClientFeedback.show('确认失败：'+e.message);button.disabled=false;}
      finally{submitting=false;button.removeAttribute('aria-busy');}
    }
    document.addEventListener('DOMContentLoaded',loadQuoteDetail);
  </script>
</body>
</html>
