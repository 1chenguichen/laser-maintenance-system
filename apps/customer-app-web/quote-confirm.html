<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>账单详情确认</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "surface-container": "#eceef0",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "error": "#ff4d4f"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=2"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head>
<body class="product-screen bg-surface pb-[180px] mobile-system" data-role="customer" data-page="quote-confirm">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">账单详情确认</h1>
    <div class="w-10"></div>
  </header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Total Amount Card -->
    <section class="bg-white border border-outline-variant rounded-xl p-6 text-center shadow-sm mt-4">
      <p class="text-sm text-on-surface-variant mb-1">报价总额</p>
      <div class="flex items-baseline justify-center">
        <span class="text-xl mr-1" style="color: #111827;">¥</span>
        <span class="text-4xl font-bold" style="color: #111827;" id="totalAmount">0.00</span>
      </div>
    </section>

    <!-- Fee Details -->
    <section class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
      <div class="px-4 py-3 border-b border-outline-variant bg-white">
        <h2 class="font-semibold" style="color: #1890ff;">费用明细</h2>
      </div>
      <div class="p-4 space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-sm text-on-surface-variant">配件费用</span>
          <span class="font-mono text-sm font-semibold" id="partsFee">¥ 0.00</span>
        </div>
        <div class="border-b border-dashed border-outline-variant"></div>
        <div class="flex justify-between items-center">
          <span class="text-sm text-on-surface-variant">维修工时费</span>
          <span class="font-mono text-sm font-semibold" id="laborFee">¥ 0.00</span>
        </div>
        <div class="border-b border-dashed border-outline-variant"></div>
      </div>
    </section>

    <!-- Payment Method -->
    <section class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
      <div class="px-4 py-3 border-b border-outline-variant bg-white">
        <h2 class="font-semibold" style="color: #1890ff;">后续支付说明</h2>
      </div>
      <div class="p-4">
        <label class="flex items-center justify-between p-3 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors" style="border: 1px solid #1890ff; background-color: #e6f7ff;">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined fill" style="color: #1890ff;">chat</span>
            <div>
              <p class="font-medium" style="color: #111827;">确认后支付30%定金</p>
              <p class="text-xs text-on-surface-variant">当前为本地模拟支付流程</p>
            </div>
          </div>
          <input checked class="form-radio h-5 w-5" style="accent-color: #1890ff;" type="radio" name="payment_method">
        </label>
      </div>
    </section>

    <!-- Order Info -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-2" style="color: #111827;">工单信息</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工单编号</span>
          <span class="font-mono" id="orderNo">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">设备型号</span>
          <span id="deviceModel">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工程师</span>
          <span id="engineerName">—</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Sticky Footer -->
  <div class="fixed bottom-[80px] w-full max-w-[414px] left-1/2 -translate-x-1/2 bg-white border-t border-outline-variant px-4 py-4 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <button id="payBtn" class="w-full py-3 text-white font-medium rounded-lg flex items-center justify-center gap-2 transition-colors shadow-md" style="background-color: #1890ff;" onclick="confirmPayment()">
      <span class="material-symbols-outlined fill">chat</span>
      <span>确认报价 <span id="payAmount">¥ 0.00</span></span>
    </button>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('home')">
      <span class="material-symbols-outlined" style="font-size: 28px;">home</span>
      <span class="text-xs mt-1">首页</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-primary relative" onclick="navigateTo('orders')">
      <div class="absolute top-2 w-12 h-8 rounded-full -z-10" style="background-color: #e6f7ff; opacity: 1;"></div>
      <span class="material-symbols-outlined fill" style="font-size: 28px;">receipt_long</span>
      <span class="text-xs mt-1 font-medium">工单</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('profile')">
      <span class="material-symbols-outlined" style="font-size: 28px;">person</span>
      <span class="text-xs mt-1">我的</span>
    </button>
  </nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('customer_token');
    var orderId = window.location.hash.slice(1) || new URLSearchParams(location.search).get('id');
    var orderData = null;

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (orderId) {
        loadQuoteDetail(orderId);
      }
    });

    function loadQuoteDetail(id) {
      fetch(API_BASE + '/customer/work-orders/' + id, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(window.readApiResponse)
        .then(function(data) {
          orderData = data;
          renderQuoteData(data);
        }).catch(function(e) {
          console.error(e);
        });
    }

    function renderQuoteData(data) {
      var total = Number(data.partsFee || 0) + Number(data.laborFee || 0);
      if (total > 0) {
        document.getElementById('totalAmount').textContent = total.toFixed(2);
        document.getElementById('payAmount').textContent = '¥ ' + total.toFixed(2);
      }
      document.getElementById('deviceModel').textContent = data.device ? data.device.model : '—';
      if (data.partsFee !== null && data.partsFee !== undefined) {
        document.getElementById('partsFee').textContent = '¥ ' + Number(data.partsFee).toFixed(2);
      }
      if (data.laborFee !== null && data.laborFee !== undefined) {
        document.getElementById('laborFee').textContent = '¥ ' + Number(data.laborFee).toFixed(2);
      }
      if (data.orderNo) {
        document.getElementById('orderNo').textContent = data.orderNo;
      }
      if (data.engineer && data.engineer.name) {
        document.getElementById('engineerName').textContent = data.engineer.name;
      }
    }

    function confirmPayment() {
      if (!orderId) {
        alert('缺少工单编号，请从订单详情进入');
        return;
      }

      fetch(API_BASE + '/customer/work-orders/' + orderId + '/confirm', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ confirm: true })
      }).then(window.readApiResponse)
        .then(function(data) {
          window.location.href = 'order-progress.html#' + orderId;
        }).catch(function(e) {
          alert('确认失败: ' + e.message);
        });
    }

    function navigateTo(page) {
      var pages = {
        'home': 'index.html',
        'orders': 'orders.html',
        'profile': 'profile.html'
      };
      if (pages[page]) {
        window.location.href = pages[page];
      }
    }
  </script>
</body>
</html>
