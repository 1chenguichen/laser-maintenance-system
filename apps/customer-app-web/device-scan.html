<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>扫码识别设备</title><script src="/app-config.js"></script><link rel="stylesheet" href="/fonts/main.css"><link rel="stylesheet" href="/product-design.css"><link rel="stylesheet" href="/device-scan.css"></head><body class="device-scan-screen" data-role="customer"><header class="scan-header"><a href="devices.html" aria-label="返回我的设备">‹</a><h1>扫码识别设备</h1><span></span></header><main><section id="scan-entry" class="scan-card"><div class="scan-symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 6H6v10m26-10h10v10M6 32v10h10m26-10v10H32M12 24h24"/><rect x="16" y="14" width="16" height="20" rx="2"/></svg></div><h2>找到设备上的二维码</h2><p>识别设备档案、所属企业和售后服务安排。</p><button id="open-camera" class="scan-primary">扫一扫</button><label class="scan-secondary" for="qr-photo">从相册识别</label><input id="qr-photo" type="file" accept="image/*" hidden><details><summary>使用设备二维码链接</summary><label for="qr-text">粘贴设备二维码链接或设备码</label><textarea id="qr-text" rows="3" placeholder="粘贴企业提供的设备二维码链接"></textarea><button id="read-link" class="scan-secondary">识别设备</button></details></section><p id="scan-status" role="status" aria-live="polite"></p><section id="scan-result" class="scan-card" hidden></section><p class="scan-footer">设备二维码用于识别档案。售后安排以企业当前配置及本次派单结果为准。</p></main><section id="camera-area" class="live-scanner" role="dialog" aria-modal="true" aria-label="扫一扫" hidden><video id="scan-video" autoplay playsinline muted></video><header><button id="stop-camera" aria-label="关闭扫一扫">‹</button><h2>扫一扫</h2><span></span></header><div class="scan-viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i><div class="scan-sweep"></div></div><p id="camera-status" role="status">将设备二维码放入框内，即可自动识别</p></section><script src="/device-scan.js"></script></body></html>
