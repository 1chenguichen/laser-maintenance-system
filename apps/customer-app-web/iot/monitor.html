<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备服务</title><script src="../app-config.js"></script></head><body><p>正在进入服务页面…</p><script>(async function(){const token=sessionStorage.getItem('iot_business_token')||localStorage.getItem('customer_token');if(!token){location.replace('../login.html');return;}try{const r=await fetch(window.APP_API_BASE+'/iot/mobile-context',{headers:{Authorization:'Bearer '+token}});const m=await window.readApiResponse(r);if(m.type==='enterprise'){if(!sessionStorage.getItem('iot_business_token')){sessionStorage.setItem('iot_business_token',token);localStorage.removeItem('customer_token');localStorage.removeItem('customer_user');}location.replace('../'+m.next);}else location.replace('../home.html');}catch{location.replace('../login.html');}})();</script></body></html>
