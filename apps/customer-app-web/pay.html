  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=2"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/client-refresh.css"><script src="/client-refresh.js" defer></script><link rel="stylesheet" href="/client-system.css"><link rel="stylesheet" href="/client-navigation.css"><script src="/client-feedback.js" defer></script><script src="/client-navigation.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-24 mobile-system" data-role="customer" data-page="pay">
  <!-- Top App Bar -->
  <header class="client-page-header"><a class="client-back" href="market-orders.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12 4-8 8 8 8M4 12h16" stroke-linecap="round" stroke-linejoin="round"/></svg></a><h1 class="client-header-title">支付状态</h1><span class="client-header-space" aria-hidden="true"></span></header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Success Icon -->
    <section class="flex flex-col items-center justify-center py-8 mt-4">
      <div class="w-20 h-20 rounded-full flex items-center justify-center mb-4" style="background-color: #eef4ff; border: 2px solid #dbe7fc;">
        <span class="material-symbols-outlined fill text-4xl" style="color: #155de9;">receipt_long</span>
      </div>
      <h2 class="text-xl font-semibold mb-1" style="color: #111827;" id="statusTitle">正在查询支付状态</h2>
      <p class="text-sm text-on-surface-variant" id="statusDesc">请稍候</p>
    </section>

    <!-- Payment Details Card -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">支付详情</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-on-surface-variant">支付方式</span>
          <span style="color: #111827;" id="paymentMethod">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">支付金额</span>
          <span class="font-bold" style="color: #1890ff;" id="payAmount">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工单编号</span>
          <span class="font-mono" id="orderNo">—</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">支付时间</span>
          <span id="payTime">—</span>
        </div>
      </div>
    </section>

    <!-- Order Info Card -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">工单信息</h3>
      <div class="flex items-start space-x-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <span class="text-lg">👨‍🔧</span>
        </div>
        <div class="flex-1">
          <p class="font-medium" style="color: #111827;" id="engineerName">—</p>
          <p class="text-sm text-on-surface-variant" id="engineerTitle">—</p>
        </div>
        <button class="px-3 py-1 rounded-lg text-xs" style="background-color: #e6f7ff; color: #1890ff;" onclick="viewProgress()">
          查看进度
        </button>
      </div>
    </section>

    <!-- Invoice Application -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">发票开具</h3>
      <p class="text-sm text-on-surface-variant mb-3">维修完成后可申请开具增值税普通发票或专用发票</p>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-3 rounded-lg" style="background-color: #f7f9fb; border: 1px solid #e5e7eb;">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">receipt_long</span>
            <span class="text-sm" style="color: #111827;">增值税普通发票</span>
          </div>
          <button class="text-xs px-3 py-1 rounded-lg" style="background-color: #e6f7ff; color: #1890ff;" disabled onclick="applyInvoice('normal')">
            申请
          </button>
        </div>
        <div class="flex items-center justify-between p-3 rounded-lg" style="background-color: #f7f9fb; border: 1px solid #e5e7eb;">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">business</span>
            <span class="text-sm" style="color: #111827;">增值税专用发票</span>
          </div>
          <button class="text-xs px-3 py-1 rounded-lg" style="background-color: #e6f7ff; color: #1890ff;" disabled onclick="applyInvoice('special')">
            申请
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Action -->
  <div class="fixed bottom-[80px] w-full max-w-[414px] left-1/2 -translate-x-1/2 bg-white border-t border-outline-variant px-4 py-4 z-40">
    <button data-ui="primary" class="w-full py-3 text-white font-medium rounded-lg" style="background-color: #1890ff;" onclick="viewProgress()">
      查看工单进度
    </button>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="mobile-navigation" aria-label="主要导航"><a href="home.html"><span class="material-symbols-outlined" aria-hidden="true">home</span><span>首页</span></a><a href="services.html"><span class="material-symbols-outlined" aria-hidden="true">travel_explore</span><span>找服务</span></a><a href="devices.html"><span class="material-symbols-outlined" aria-hidden="true">precision_manufacturing</span><span>设备</span></a><a href="market-orders.html" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span><span>订单</span></a><a href="profile.html"><span class="material-symbols-outlined" aria-hidden="true">person</span><span>我的</span></a></nav>

  <script>
    var API_BASE=window.APP_API_BASE,token=localStorage.getItem('customer_token');
    var orderId=new URLSearchParams(location.search).get('orderId')||location.hash.slice(1),paymentOrder=null;
    if(!token)location.href='login.html';
    function text(id,value){document.getElementById(id).textContent=value;}
    function resetPayment(){paymentOrder=null;['payAmount','orderNo','payTime','engineerName','engineerTitle','paymentMethod'].forEach(id=>text(id,'—'));document.querySelectorAll('[onclick^="applyInvoice"]').forEach(b=>b.disabled=true);}
    async function loadPaymentDetail(){
      resetPayment();text('statusTitle','正在查询支付状态');text('statusDesc','金额与状态以工单记录为准');
      if(!/^[a-f0-9-]{36}$/i.test(orderId||'')){text('statusTitle','无法查询支付状态');ClientFeedback.show('缺少有效工单编号，请从订单详情进入');return;}
      ClientFeedback.show('正在读取工单…','loading');
      try{
        var data=await fetch(API_BASE+'/customer/work-orders/'+encodeURIComponent(orderId),{headers:{Authorization:'Bearer '+token}}).then(window.readApiResponse);
        paymentOrder=data;var pre=Number(data.prepayAmount||0),final=Number(data.finalPaymentAmount||0);
        var paid=['REPAIRING','PENDING_FINAL_PAYMENT','COMPLETED'].includes(data.status),amount=data.status==='COMPLETED'?pre+final:pre;
        if(!Number.isFinite(amount)||amount<0)throw new Error('支付金额异常');
        text('statusTitle',paid?(amount>0?'工单已确认收款':'无需支付'):'尚未确认收款');
        text('statusDesc',paid?'当前为本地演示工单收款状态，非第三方支付凭证':'请在工单详情查看报价与待付款项');
        text('payAmount',paid?'¥ '+amount.toFixed(2):'—');text('paymentMethod',paid&&amount>0?'本地演示记账':'—');text('orderNo',data.orderNo||'—');text('engineerName',data.engineer?.name||'—');text('engineerTitle',data.engineer?'服务工程师':'—');ClientFeedback.clear();
        document.querySelectorAll('[onclick^="applyInvoice"]').forEach(b=>b.disabled=!(paid&&amount>0&&data.status==='COMPLETED'));
      }catch(e){resetPayment();text('statusTitle','支付状态读取失败');text('statusDesc','暂不能确认金额及支付结果');ClientFeedback.show('读取失败：'+e.message,'error',loadPaymentDetail);}
    }
    function viewProgress(){location.href=orderId?'order-progress.html#'+encodeURIComponent(orderId):'market-orders.html';}
    function applyInvoice(){if(paymentOrder?.status==='COMPLETED')location.href='business.html#invoices';}
    document.addEventListener('DOMContentLoaded',loadPaymentDetail);
  </script>
</body>
</html>
