<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>合同与发票</title><script src="/app-config.js"></script><script src="/tailwind.js"></script><link href="/fonts/main.css" rel="stylesheet"><link href="/fonts/material-symbols.css" rel="stylesheet"><link rel="stylesheet" href="/product-design.css?v=2"><link rel="stylesheet" href="/account-surfaces.css"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head><body class="product-screen account-surface mobile-system" data-role="customer" data-page="business"><header><button onclick="location.href='profile.html'" aria-label="返回我的"><span class="material-symbols-outlined" style="color:#1474d8">arrow_back</span></button><h1>合同与发票</h1><span class="account-header-spacer" aria-hidden="true"></span></header><main><div class="contract-tabs" role="group" aria-label="合同与发票分类"><button data-tab="contracts" class="active" onclick="changeTab('contracts')">我的合同</button><button data-tab="invoices" onclick="changeTab('invoices')">发票与申请</button></div><div id="error" role="alert"></div><div id="businessList"><div class="empty">正在加载…</div></div></main><nav aria-label="主要导航"></nav>
<dialog id="invoiceDialog"><form onsubmit="submitInvoice(event)"><h2>申请开票</h2><label class="field"><span>已付款单据</span><select id="invoiceSource" required></select></label><label class="field"><span>发票抬头</span><input id="invoiceTitle" minlength="2" maxlength="100" required placeholder="公司全称或个人姓名"></label><label class="field"><span>税号（个人抬头可不填）</span><input id="taxNumber" maxlength="30"></label><p style="font-size:11px;color:#8796aa">提交后由财务审核办理，开票结果会显示在发票记录中。</p><div id="invoiceError" style="color:#bd5846;font-size:12px;margin-top:12px"></div><div class="form-actions"><button type="button" onclick="document.getElementById('invoiceDialog').close()">取消</button><button id="invoiceSubmit" type="submit">提交申请</button></div></form></dialog>
<script>
var token=localStorage.getItem('customer_token'),contracts=[],finance,tab=location.hash==='#invoices'?'invoices':'contracts',busy=false,text=window.escapeHtml;
if(!token)location.href='login.html';
function available(b){return Math.round((b.paid-finance.records.filter(function(r){return r.kind==='INVOICE'&&r.sourceId===b.id&&['REQUESTED','ISSUED'].includes(r.status)}).reduce(function(n,r){return n+Number(r.amount)},0))*100)/100}
function cash(n){return '¥'+Number(n||0).toFixed(2)}
async function call(path,body){return window.readApiResponse(await fetch(window.APP_API_BASE+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},...(body===undefined?{}:{body:JSON.stringify(body)})}))}
async function loadBusiness(){try{var result=await Promise.all([call('/operations/contracts'),call('/operations/finance')]);contracts=result[0];finance=result[1];changeTab(tab)}catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').className='business-error'}}
function changeTab(value){tab=value;if(location.hash!=='#'+value)history.replaceState(null,'','#'+value);document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});render()}
function detailRows(rows){return '<dl class="account-details">'+rows.map(function(row){return '<div><dt>'+text(row[0])+'</dt><dd>'+text(row[1])+'</dd></div>'}).join('')+'</dl>'}
function cardTitle(icon,title,number,status){return '<div class="account-card-head"><span class="material-symbols-outlined account-card-icon" aria-hidden="true">'+icon+'</span><div class="account-card-name"><h2>'+text(title)+'</h2><p>'+text(number)+'</p></div><span class="status">'+text(status)+'</span></div>'}
function render(){
 if(!finance)return;
 document.querySelectorAll('[data-tab]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.tab===tab))});
 var el=document.getElementById('businessList');
 if(tab==='contracts'){
 el.innerHTML=contracts.map(function(c){var today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'}),valid=c.status==='ACTIVE'&&c.startDate<=today&&c.endDate>=today;
 return '<section class="business-card">'+cardTitle('description',c.title,c.number,valid?'保障中':c.status==='DRAFT'?'待生效':c.status==='TERMINATED'?'已终止':'未在保障期')+detailRows([['服务期限',c.startDate+' 至 '+c.endDate],['人工服务',c.laborIncluded?'合同包含人工费':'人工费按次结算'],['配件结算','按原价 '+Number(c.partsDiscount)+'%'],['覆盖设备',c.deviceIds.length?c.deviceIds.length+' 台指定设备':'您的全部设备'],['合同金额',cash(c.amount)]])+(c.terms?'<p class="account-note">'+text(c.terms)+'</p>':'')+(valid?'<button class="account-row-action" onclick="location.href=\'repair-form.html\'"><span>使用合同报修</span><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>':'')+'</section>';
 }).join('')||'<section class="business-card empty">暂无服务合同<p>签约后可在这里查看保障范围。</p></section>';
 }else{
 var invoices=finance.records.filter(function(r){return r.kind==='INVOICE'}),eligible=finance.bills.filter(function(b){return available(b)>0});
 el.innerHTML='<section class="business-card account-invoice-entry"><div><span class="material-symbols-outlined account-card-icon" aria-hidden="true">receipt_long</span><strong>申请开票</strong></div><p>已付款且仍有可开票额度的单据可提交申请。</p><button class="business-button" onclick="openInvoice()" '+(eligible.length?'':'disabled')+'>申请开票</button></section>'+invoices.map(function(r){var bill=finance.bills.find(function(b){return b.id===r.sourceId});return '<section class="business-card">'+cardTitle('receipt_long',r.title,r.number,r.status==='ISSUED'?'已登记发票':'待财务办理')+detailRows([['关联单据',bill?bill.number:'—'],['开票金额',cash(r.amount)],['税号',r.taxNumber||'个人抬头'],...(r.invoiceNumber?[['发票号码',r.invoiceNumber]]:[]),['申请日期',new Date(r.createdAt).toLocaleDateString('zh-CN')]])+'</section>'}).join('')+(invoices.length?'':'<section class="business-card empty">暂无发票申请记录</section>');
 }
}
function openInvoice(){var invoices=finance.records.filter(function(r){return r.kind==='INVOICE'}),select=document.getElementById('invoiceSource');select.replaceChildren(new Option('请选择',''));finance.bills.filter(function(b){return available(b)>0}).forEach(function(b){select.add(new Option(b.number+' · 可申请 '+cash(available(b)),b.sourceType+':'+b.id))});document.getElementById('invoiceError').textContent='';document.getElementById('invoiceDialog').showModal()}
async function submitInvoice(e){e.preventDefault();if(busy)return;busy=true;document.getElementById('invoiceSubmit').disabled=true;try{var source=document.getElementById('invoiceSource').value.split(':');await call('/operations/invoices',{sourceType:source[0],sourceId:source[1],title:document.getElementById('invoiceTitle').value,taxNumber:document.getElementById('taxNumber').value});document.getElementById('invoiceDialog').close();await loadBusiness()}catch(e){document.getElementById('invoiceError').textContent=e.message}finally{busy=false;document.getElementById('invoiceSubmit').disabled=false}}
document.addEventListener('DOMContentLoaded',loadBusiness);
window.addEventListener('hashchange',function(){tab=location.hash==='#invoices'?'invoices':'contracts';loadBusiness()});
window.addEventListener('focus',loadBusiness);
setInterval(function(){if(!document.hidden&&!document.getElementById('invoiceDialog').open)loadBusiness()},8000);
</script></body></html>
