<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>官方延保套餐</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "warning": "#faad14"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=2"><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head>
<body class="product-screen bg-surface pb-24 mobile-system" data-role="customer" data-page="warranty">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">官方延保套餐</h1>
    <div class="w-10"></div>
  </header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Hero Banner -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 mt-4 warranty-intro">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-3xl" style="color:#1890ff">shield</span>
        <div>
          <h2 class="font-semibold text-lg">官方延保服务</h2>
          <p class="text-sm text-on-surface-variant mt-1">延长设备质保期，享受原厂配件与服务</p>
        </div>
      </div>
    </section>

    <!-- Coverage Benefits -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">延保服务内容</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">原厂配件更换</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">优先上门服务</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">年度免费保养</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">7x24热线支持</span>
        </div>
      </div>
    </section>

    <!-- Warranty Plans -->
    <section class="space-y-3" id="warrantyPlans">
      <!-- Plan 1: 1 Year -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors" onclick="selectPlan('1year', this)">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保1年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长12个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥2,800</p>
            <p class="text-xs text-on-surface-variant">原价参考</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #e6f7ff; color: #1890ff;">推荐</span>
        </div>
      </div>

      <!-- Plan 2: 2 Years -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors relative" onclick="selectPlan('2year', this)">
        <div class="absolute -top-2 -right-2 px-2 py-0.5 rounded-full text-xs text-white" style="background-color: #ff4d4f;">
          热销
        </div>
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保2年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长24个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥4,800</p>
            <p class="text-xs text-on-surface-variant">省¥800</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant flex items-center justify-between">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #fff2f0; color: #ff4d4f;">超值套餐</span>
          <span class="text-xs text-on-surface-variant">相当于每月¥200</span>
        </div>
      </div>

      <!-- Plan 3: 3 Years -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors" onclick="selectPlan('3year', this)">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保3年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长36个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥6,500</p>
            <p class="text-xs text-on-surface-variant">省¥1,900</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #fffbe6; color: #faad14;">VIP尊享</span>
        </div>
      </div>
    </section>

    <!-- Select Device -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">选择设备</h3>
      <select id="deviceSelect" class="w-full p-3 border border-outline-variant rounded-lg text-sm bg-white" onchange="updatePrice()">
        <option value="">请选择要购买延保的设备</option>
      </select>
    </section>

    <!-- Price Summary -->
    <section id="priceSummary" class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-on-surface-variant">参考延保费用</p>
          <p class="text-lg font-bold mt-1" style="color: #1890ff;" id="totalPrice">¥4,800</p>
        </div>
        <button class="px-4 py-2 rounded-lg text-sm text-white" style="background-color: #1890ff;" onclick="purchaseWarranty()">
          咨询延保
        </button>
      </div>
    </section>
  </main>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('customer_token');
    var selectedPlan = '2year';
    var selectedDevice = '';
    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var devices = await window.readApiResponse(await fetch(API_BASE + '/customer/devices', { headers: { Authorization: 'Bearer ' + token } }));
        var select = document.getElementById('deviceSelect');
        devices.forEach(function (d) { select.add(new Option(d.model + ' - ' + d.serialNumber, d.id)); });
      } catch (err) { alert(err.message); }
    });

    if (!token) {
      window.location.href = 'login.html';
    }

    function selectPlan(plan, element) {
      selectedPlan = plan;
      updatePrice();
      // Highlight selected
      document.querySelectorAll('#warrantyPlans > div').forEach(function(el) {
        el.classList.remove('border-primary');
        el.classList.add('border-outline-variant');
      });
      event.currentTarget.classList.remove('border-outline-variant');
      if (element) element.classList.add('border-primary');
    }

    function updatePrice() {
      var prices = { '1year': 2800, '2year': 4800, '3year': 6500 };
      document.getElementById('totalPrice').textContent = '¥' + prices[selectedPlan].toLocaleString();
    }

    function purchaseWarranty() {
      var deviceId = document.getElementById('deviceSelect').value;
      if (!deviceId) {
        alert('请选择设备');
        return;
      }
      window.location.href = 'chat.html';
    }
  </script>
</body>
</html>
