<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>官方延保套餐</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "warning": "#faad14"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
</head>
<body class="bg-surface pb-24">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">官方延保套餐</h1>
    <div class="w-10"></div>
  </header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Hero Banner -->
    <section class="rounded-xl p-4 text-white mt-4" style="background: linear-gradient(135deg, #1890ff 0%, #0052d9 100%);">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined fill text-4xl">shield</span>
        <div>
          <h2 class="font-semibold text-lg">官方延保服务</h2>
          <p class="text-sm opacity-90 mt-1">延长设备质保期，享受原厂配件与服务</p>
        </div>
      </div>
    </section>

    <!-- Coverage Benefits -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">延保服务内容</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">原厂配件更换</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">优先上门服务</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">年度免费保养</span>
        </div>
        <div class="flex items-center gap-2 p-3 rounded-lg" style="background-color: #f7f9fb;">
          <span class="material-symbols-outlined fill text-secondary">check_circle</span>
          <span class="text-xs" style="color: #111827;">7x24热线支持</span>
        </div>
      </div>
    </section>

    <!-- Warranty Plans -->
    <section class="space-y-3" id="warrantyPlans">
      <!-- Plan 1: 1 Year -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors" onclick="selectPlan('1year')">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保1年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长12个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥2,800</p>
            <p class="text-xs text-on-surface-variant">原价参考</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #e6f7ff; color: #1890ff;">推荐</span>
        </div>
      </div>

      <!-- Plan 2: 2 Years -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors relative" onclick="selectPlan('2year')">
        <div class="absolute -top-2 -right-2 px-2 py-0.5 rounded-full text-xs text-white" style="background-color: #ff4d4f;">
          热销
        </div>
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保2年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长24个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥4,800</p>
            <p class="text-xs text-on-surface-variant">省¥800</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant flex items-center justify-between">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #fff2f0; color: #ff4d4f;">超值套餐</span>
          <span class="text-xs text-on-surface-variant">相当于每月¥200</span>
        </div>
      </div>

      <!-- Plan 3: 3 Years -->
      <div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm cursor-pointer hover:border-primary transition-colors" onclick="selectPlan('3year')">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-semibold" style="color: #111827;">延保3年</h3>
            <p class="text-xs text-on-surface-variant mt-1">设备质保期延长36个月</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold" style="color: #1890ff;">¥6,500</p>
            <p class="text-xs text-on-surface-variant">省¥1,900</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-outline-variant">
          <span class="px-2 py-1 rounded text-xs" style="background-color: #fffbe6; color: #faad14;">VIP尊享</span>
        </div>
      </div>
    </section>

    <!-- Select Device -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">选择设备</h3>
      <select id="deviceSelect" class="w-full p-3 border border-outline-variant rounded-lg text-sm bg-white" onchange="updatePrice()">
        <option value="">请选择要购买延保的设备</option>
        <option value="1" data-model="3000W激光切割机" data-price="2800">3000W激光切割机 - 延保1年 ¥2,800</option>
        <option value="2" data-model="2000W激光焊接机" data-price="4800" selected>2000W激光焊接机 - 延保2年 ¥4,800</option>
        <option value="3" data-model="1500W激光清洗机" data-price="6500">1500W激光清洗机 - 延保3年 ¥6,500</option>
      </select>
    </section>

    <!-- Price Summary -->
    <section id="priceSummary" class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-on-surface-variant">延保费用</p>
          <p class="text-lg font-bold mt-1" style="color: #1890ff;" id="totalPrice">¥4,800</p>
        </div>
        <button class="px-4 py-2 rounded-lg text-sm text-white" style="background-color: #1890ff;" onclick="purchaseWarranty()">
          立即购买
        </button>
      </div>
    </section>
  </main>

  <script>
    var API_BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    var token = localStorage.getItem('customer_token');
    var selectedPlan = '2year';
    var selectedDevice = '2';

    if (!token) {
      window.location.href = 'login.html';
    }

    function selectPlan(plan) {
      selectedPlan = plan;
      updatePrice();
      // Highlight selected
      document.querySelectorAll('#warrantyPlans > div').forEach(function(el) {
        el.classList.remove('border-primary');
        el.classList.add('border-outline-variant');
      });
      event.currentTarget.classList.remove('border-outline-variant');
      event.currentTarget.classList.add('border-primary');
    }

    function updatePrice() {
      var select = document.getElementById('deviceSelect');
      var option = select.options[select.selectedIndex];
      if (option && option.dataset.price) {
        document.getElementById('totalPrice').textContent = '¥' + Number(option.dataset.price).toLocaleString();
      }
    }

    function purchaseWarranty() {
      var deviceId = document.getElementById('deviceSelect').value;
      if (!deviceId) {
        alert('请选择设备');
        return;
      }
      alert('即将跳转支付...');
    }
  </script>
</body>
</html>
