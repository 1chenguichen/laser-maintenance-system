<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工单进度与评价</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "error": "#ff4d4f"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: -16px;
      width: 2px;
      background-color: #e5e7eb;
    }
    .timeline-item:last-child::before {
      display: none;
    }
  </style>
<link rel="stylesheet" href="/flow-design.css"><link rel="stylesheet" href="/product-design.css?v=2"><script src="/service-experience.js" defer></script><link rel="stylesheet" href="/service-experience.css"><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head>
<body class="product-screen flow-screen bg-surface mobile-system" data-role="customer" data-page="order-progress">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" aria-label="返回上一页" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">工单进度</h1>
    <span class="w-10" aria-hidden="true"></span>
  </header>

  <main class="pt-14 px-4 pb-6">
    <aside class="flow-summary"><small>本次服务 · 当前进度</small><p id="flowNext">正在核实维修进度…</p><div id="flowCompany" class="flow-company"></div></aside>
<div id="flowFeedback" class="flow-feedback" role="alert" hidden><p id="flowError"></p><button id="flowRetry" type="button" onclick="loadOrderDetail(orderId)">重新加载</button><a href="orders.html">返回工单列表</a></div>
    <!-- Order Info Card -->
    <section class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold" style="color: #111827;" id="orderTitle">正在读取工单</h2>
        <span id="orderStatus" class="px-2 py-1 rounded-lg text-xs font-medium" style="background-color: #e6f7ff; color: #1890ff;">加载中</span>
      </div>
      <p class="text-sm text-on-surface-variant" id="orderNo">工单号：—</p>
      <p class="text-sm text-on-surface-variant mt-1" id="orderTime">创建时间：—</p>
    </section>

    <!-- Engineer Info -->
    <section class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm flex items-center space-x-4">
      <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
        <span class="text-xl"><span class="material-symbols-outlined">engineering</span></span>
      </div>
      <div class="flex-1">
        <p class="font-semibold" style="color: #111827;" id="engineerName">暂无工程师</p>
        <p class="text-sm text-on-surface-variant" id="engineerTitle">-</p>
        <div class="flex items-center gap-1 mt-1">
          <span class="text-sm" style="color: #faad14;" id="engineerRating">-</span>
          <span class="text-xs text-on-surface-variant" id="engineerScore">-</span>
        </div>
      </div>
      <button class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center" onclick="callEngineer()">
        <span class="material-symbols-outlined" style="color: #1890ff;">phone</span>
      </button>
    </section>

    <!-- Progress Timeline -->
    <section class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm">
      <h3 class="font-semibold mb-4" style="color: #111827;">维修进度</h3>
      <div class="space-y-0" id="timeline">
        <!-- Timeline items will be inserted here -->
      </div>
    </section>

    <!-- Fault Description -->
    <section class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm">
      <h3 class="font-semibold mb-2" style="color: #111827;">故障描述</h3>
      <p class="text-sm text-on-surface-variant break-all" id="faultDesc">-</p>
      <div class="flex flex-wrap gap-2 mt-3" id="faultTags"></div>
    </section>

    <!-- Quote Info (if available) -->
    <section id="quoteSection" class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">报价信息</h3>
      <div class="space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-on-surface-variant">配件费</span>
          <span class="font-medium" id="partsFee">-</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-on-surface-variant">人工费</span>
          <span class="font-medium" id="laborFee">-</span>
        </div>
        <div class="flex justify-between text-sm border-t border-outline-variant pt-2 mt-2">
          <span class="font-semibold">合计</span>
          <span class="font-bold" style="color: #1890ff;" id="totalFee">-</span>
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <section id="actionSection" class="mt-6 space-y-3">
      <button id="confirmQuoteBtn" class="w-full py-3 text-white font-medium rounded-lg hidden" style="background-color: #1890ff;" onclick="confirmQuote()">
        确认报价
      </button>
      <button id="payPrepaymentBtn" class="w-full py-3 text-white font-medium rounded-lg hidden" style="background-color: #1890ff;" onclick="payPrepayment()">
        支付定金 <span id="prepaymentAmount"></span>
      </button>
      <button id="payFinalBtn" class="w-full py-3 text-white font-medium rounded-lg hidden" style="background-color: #1890ff;" onclick="payFinal()">
        <span id="finalPayLabel">支付尾款</span> <span id="finalPaymentAmount"></span>
      </button>
      <button id="reviewBtn" class="w-full py-3 border font-medium rounded-lg hidden" style="border-color: #1890ff; color: #1890ff;" onclick="showReview()">
        立即评价
      </button>
    </section>

    <!-- Review Section (hidden by default) -->
    <section id="reviewSection" class="bg-white rounded-xl border border-outline-variant p-4 mt-4 shadow-sm hidden">
      <h3 class="font-semibold mb-3" style="color: #111827;">服务评价</h3>
      <div class="flex items-center gap-2 mb-4">
        <span class="text-sm text-on-surface-variant">评分：</span>
        <div id="starRating" class="flex gap-1">
          <button class="text-2xl star-btn" data-rating="1" onclick="setRating(1)">☆</button>
          <button class="text-2xl star-btn" data-rating="2" onclick="setRating(2)">☆</button>
          <button class="text-2xl star-btn" data-rating="3" onclick="setRating(3)">☆</button>
          <button class="text-2xl star-btn" data-rating="4" onclick="setRating(4)">☆</button>
          <button class="text-2xl star-btn" data-rating="5" onclick="setRating(5)">☆</button>
        </div>
      </div>
      <textarea id="reviewContent" class="w-full p-3 border border-outline-variant rounded-lg text-sm" rows="3" placeholder="请输入您的评价..."></textarea>
      <button class="w-full py-3 mt-3 text-white font-medium rounded-lg" style="background-color: #1890ff;" onclick="submitReview()">
        提交评价
      </button>
    </section>
  </main>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('customer_token');
    var orderId = window.location.hash.slice(1)||new URLSearchParams(location.search).get('id');
    var orderData = null;
    var currentRating = 5;

    if (!token) {
      window.location.href = 'login.html';
    }

    // 脚本在 body 底部，DOM 已加载完成，直接调用
    if (orderId) {
      loadOrderDetail(orderId);
      setInterval(function () { if (!document.hidden) loadOrderDetail(orderId); }, 5000);
    } else {
      document.getElementById('flowFeedback').hidden = false;
      document.getElementById('flowError').textContent = '缺少工单编号，请从工单列表重新进入。';
      document.getElementById('flowRetry').hidden = true;
      document.getElementById('flowNext').textContent = '请选择需要查看的工单';
      document.getElementById('orderStatus').textContent = '未选择工单';
      document.getElementById('actionSection').hidden = true;
    }

    function loadOrderDetail(id) {
      fetch(API_BASE + '/customer/work-orders/' + id, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(window.readApiResponse)
        .then(function(data) {
          document.getElementById('flowFeedback').hidden = true;
          document.getElementById('actionSection').hidden = false;
          orderData = data;
          renderOrderData(data);
        }).catch(function(e) {
          console.error('Load error:', e);
          document.getElementById('orderStatus').textContent = '加载失败';
          document.getElementById('flowFeedback').hidden = false;
          document.getElementById('flowError').textContent = '进度暂时无法更新：' + e.message + '。请重新加载后再操作。';
          document.getElementById('flowNext').textContent = '当前进度未确认';
          document.getElementById('actionSection').hidden = true;
        });
    }


    function renderOrderData(data) {
      document.getElementById('flowCompany').textContent = '服务企业：' + (data.serviceName || '当前设备服务企业');
      document.getElementById('flowNext').textContent = ({PENDING:'报修已收到，等待服务企业安排',DISPATCHED:'已安排工程师，等待接单上门',ACCEPTED:'工程师正在处理，请等待检测与报价',PENDING_PAYMENT:data.customerConfirm?'报价已确认，请完成定金支付':'请核对维修报价并确认',REPAIRING:'维修正在进行，请关注处理进度',PENDING_FINAL_PAYMENT:'维修已完成，请核对费用并结算',COMPLETED:'服务已完成，可查看记录及评价',CANCELLED:'本次报修已取消',REFUSED:'本次服务未受理，请联系服务企业'})[data.status] || '请核对当前工单状态';
      document.getElementById('orderTime').textContent = '创建时间：' + (data.createdAt ? new Date(data.createdAt).toLocaleString('zh-CN') : '—');
      document.getElementById('orderTitle').textContent = data.faultType || '设备维修';
      document.getElementById('orderNo').textContent = '工单号：' + (data.orderNo || data.id);
      document.getElementById('orderStatus').textContent = getStatusText(data.status);
      document.getElementById('faultDesc').textContent = data.faultDescription || '-';

      if (data.engineer) {
        document.getElementById('engineerName').textContent = data.engineer.name || '未知工程师';
      }

      function money(value){return value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value))?'¥'+Number(value).toFixed(2):'待核实';}
      document.getElementById('partsFee').textContent=money(data.partsFee);
      document.getElementById('laborFee').textContent=money(data.laborFee);
      // Pending settlement follows backend payFinalPayment: final quote or parts + labor, minus deposit.
      var hasTotal=data.finalAmount!=null || (data.partsFee!=null && data.laborFee!=null);
      var total=hasTotal?(Number(data.finalAmount)||Number(data.partsFee||0)+Number(data.laborFee||0)):null;
      document.getElementById('totalFee').textContent=money(total);
      document.getElementById('prepaymentAmount').textContent=money(data.prepayAmount);
      document.getElementById('finalPaymentAmount').textContent='待核实';

      // 渲染时间线
      renderTimeline(data.status);

      // Show/hide buttons based on status
      var confirmQuoteBtn = document.getElementById('confirmQuoteBtn');
      var payPrepaymentBtn = document.getElementById('payPrepaymentBtn');
      var payFinalBtn = document.getElementById('payFinalBtn');
      var reviewBtn = document.getElementById('reviewBtn');

      // 初始隐藏所有按钮
      confirmQuoteBtn.classList.add('hidden');
      payPrepaymentBtn.classList.add('hidden');
      payFinalBtn.classList.add('hidden');
      reviewBtn.classList.add('hidden');

      if (data.status === 'PENDING' || data.status === 'DISPATCHED' || data.status === 'ACCEPTED') {
        // 报价未确认，显示"确认报价"按钮
        if (data.partsFee || data.laborFee) {
          confirmQuoteBtn.classList.remove('hidden');
        }
      } else if (data.status === 'PENDING_PAYMENT') {
        // PENDING_PAYMENT 状态需要区分：customerConfirm 为 false 时需要确认报价，为 true 时支付定金
        if (data.customerConfirm) {
          // 已确认报价，待支付定金，显示"支付定金"按钮
          payPrepaymentBtn.classList.remove('hidden');
          payPrepaymentBtn.disabled=data.prepayAmount==null||!Number.isFinite(Number(data.prepayAmount));
          document.getElementById('prepaymentAmount').textContent=money(data.prepayAmount);
        } else {
          // 待确认报价，显示"确认报价"按钮
          confirmQuoteBtn.classList.remove('hidden');
        }
      } else if (data.status === 'PENDING_FINAL_PAYMENT') {
        // 维修完成，待支付尾款，显示"支付尾款"按钮
        payFinalBtn.classList.remove('hidden');
        var finalPay=total!==null&&data.prepayAmount!=null?Math.round((total-Number(data.prepayAmount))*100)/100:null;
        payFinalBtn.disabled=finalPay===null||!Number.isFinite(finalPay)||finalPay<0;
        document.getElementById('finalPayLabel').textContent=finalPay===0?'确认完工':finalPay<0?'结算金额需客服核对':'支付尾款';
        document.getElementById('finalPaymentAmount').textContent=finalPay===0?'':money(finalPay);
      } else if (data.status === 'COMPLETED') {
        // 只有未评价时才显示评价按钮
        if (!data.reviewed) {
          reviewBtn.classList.remove('hidden');
        }
      }
    }

    function renderTimeline(status) {
      // 根据状态确定时间线步骤
      var steps = [
        { icon: 'check_circle', text: '已提交报修', done: true, current: false },
        { icon: 'engineering', text: '已派单，等待上门', done: false, current: false },
        { icon: 'location_on', text: '工程师已确认上门', done: false, current: false },
        { icon: 'request_quote', text: '等待报价确认', done: false, current: false },
        { icon: 'build', text: '维修中', done: false, current: false },
        { icon: 'payment', text: '待付尾款', done: false, current: false },
        { icon: 'task_alt', text: '已完成', done: false, current: false }
      ];

      // 根据状态确定当前步骤索引
      var currentStep = 0;
      if (status === 'PENDING') {
        currentStep = 0;
      } else if (status === 'DISPATCHED') {
        currentStep = 1;
      } else if (status === 'ACCEPTED') {
        currentStep = 2;
      } else if (status === 'PENDING_PAYMENT') {
        currentStep = 3;
      } else if (status === 'REPAIRING') {
        currentStep = 4;
      } else if (status === 'PENDING_FINAL_PAYMENT') {
        currentStep = 5;
      } else if (status === 'COMPLETED') {
        currentStep = 6;
      }

      // 更新步骤的状态：done 表示已完成，current 表示当前步骤
      for (var i = 0; i < steps.length; i++) {
        if (i < currentStep) {
          steps[i].done = true;
          steps[i].current = false;
        } else if (i === currentStep) {
          steps[i].done = false;
          steps[i].current = true;
        } else {
          steps[i].done = false;
          steps[i].current = false;
        }
      }

      var timelineHTML = '';
      steps.forEach(function(step) {
        var iconColor;
        if (step.done) {
          iconColor = 'color: #52c41a;';
        } else if (step.current) {
          iconColor = 'color: #1890ff;';
        } else {
          iconColor = 'color: #d1d5db;';
        }
        var textClass = step.current ? 'font-bold' : (step.done ? '' : 'text-on-surface-variant');
        timelineHTML += '<div class="timeline-item relative pl-10 pb-6">' +
          '<span class="material-symbols-outlined fill absolute left-0 w-8 h-8 flex items-center justify-center" style="' + iconColor + '">' + (step.icon === 'payment' ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M7 15h4"></path></svg>' : step.icon) + '</span>' +
          '<p class="text-sm font-medium ' + textClass + '" style="color: #191c1e;">' + step.text + '</p></div>';
      });
      document.getElementById('timeline').innerHTML = timelineHTML;
    }

    function getStatusText(status) {
      var map = {
        'PENDING': '待派单',
        'DISPATCHED': '已派单',
        'ACCEPTED': '已上门',
        'PENDING_PAYMENT': '待支付定金',
        'REPAIRING': '维修中',
        'PENDING_FINAL_PAYMENT': '待付尾款',
        'COMPLETED': '已完成'
      };
      return map[status] || status;
    }

    function setRating(rating) {
      currentRating = rating;
      var stars = document.querySelectorAll('.star-btn');
      stars.forEach(function(star, index) {
        star.textContent = index < rating ? '★' : '☆';
        star.style.color = index < rating ? '#faad14' : '#d1d5db';
      });
    }

    function confirmQuote() {
      if (!orderId) {
        alert('缺少工单ID');
        return;
      }
      fetch(API_BASE + '/customer/work-orders/' + orderId + '/confirm', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ confirm: true })
      }).then(window.readApiResponse)
        .then(function(data) {
          alert('报价已确认！');
          loadOrderDetail(orderId);
        }).catch(function(e) {
          alert('确认失败: ' + e.message);
        });
    }

    function payPrepayment() {
      if (!orderId) {
        alert('缺少工单ID');
        return;
      }
      fetch(API_BASE + '/customer/work-orders/' + orderId + '/pay-prepayment', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(window.readApiResponse)
        .then(function(data) {
          alert('定金支付成功！');
          loadOrderDetail(orderId);
        }).catch(function(e) {
          alert('支付失败: ' + e.message);
        });
    }

    function payFinal() {
      if (!orderId) {
        alert('缺少工单编号，请从工单列表进入');
        return;
      }
      fetch(API_BASE + '/customer/work-orders/' + orderId + '/pay-final', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(window.readApiResponse)
        .then(function(data) {
          alert('尾款支付成功！');
          // 刷新页面状态
          loadOrderDetail(orderId);
        }).catch(function(e) {
          alert('支付失败: ' + e.message);
        });
    }

    function showReview() {
      document.getElementById('reviewSection').classList.remove('hidden');
      document.getElementById('reviewBtn').classList.add('hidden');
      setRating(5);
    }

    function submitReview() {
      if (!orderId) {
        alert('缺少工单编号，请从工单列表进入');
        return;
      }
      fetch(API_BASE + '/customer/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          workOrderId: orderId,
          rating: currentRating,
          content: document.getElementById('reviewContent').value || '服务很好！'
        })
      }).then(window.readApiResponse)
        .then(function(data) {
          alert('评价成功，感谢您的反馈！');
          document.getElementById('reviewSection').classList.add('hidden');
          // 刷新页面状态
          loadOrderDetail(orderId);
        }).catch(function(e) {
          alert('评价失败: ' + e.message);
        });
    }

    function callEngineer() {
      alert('即将拨打工程师电话');
    }
  </script>
</body>
</html>
