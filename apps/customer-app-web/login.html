<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登录 - 设备报修门户</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "error": "#ff4d4f"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background: linear-gradient(135deg, #1890ff 0%, #0052d9 100%);
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <main class="flex-1 flex flex-col justify-center px-6">
    <!-- Logo Section -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-2xl bg-white flex items-center justify-center shadow-lg mb-4 overflow-hidden">
        <img src="logo.png" alt="logo" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-bold text-white">设备报修门户</h1>
      <p class="text-sm text-white/80 mt-2">激光设备售后服务平台</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-semibold mb-4" style="color: #111827;">用户登录</h2>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="space-y-4">
          <!-- Phone Input -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #43474f;">手机号</label>
            <div class="relative">
              <input type="tel" id="phone" placeholder="请输入手机号"
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                value="13800138000">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs" style="color: #1890ff;" onclick="sendCode()" id="sendCodeBtn">发送验证码</span>
            </div>
          </div>

          <!-- SMS Code Input -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #43474f;">验证码</label>
            <input type="text" id="smsCode" placeholder="请输入验证码" maxlength="6"
              class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
              value="000000">
          </div>

          <!-- Demo Hint -->
          <div class="p-3 rounded-lg" style="background-color: #f7f9fb;">
            <p class="text-xs" style="color: #43474f;">
              <span class="font-medium">演示模式：</span>已预填手机号和验证码，直接点击登录即可
            </p>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="loginBtn"
            class="w-full py-3 text-white font-medium rounded-lg transition-all duration-150 active:scale-[0.98]"
            style="background-color: #1890ff; box-shadow: 0 4px 12px rgba(24,144,255,0.35);">
            登录
          </button>

          <!-- Register Link -->
          <p class="text-sm text-center mt-3" style="color: #43474f;">
            没有账号？<a href="register.html" class="font-medium" style="color: #1890ff;">立即注册</a>
          </p>
        </div>
      </form>

      <!-- Other Login Methods -->
      <div class="mt-6 pt-6 border-t border-outline-variant">
        <p class="text-xs text-center" style="color: #737780;">其他登录方式</p>
        <div class="flex justify-center gap-6 mt-4">
          <button class="flex flex-col items-center" onclick="quickLogin('wechat')">
            <div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center mb-1">
              <span class="text-2xl">💬</span>
            </div>
            <span class="text-xs" style="color: #43474f;">微信</span>
          </button>
          <button class="flex flex-col items-center" onclick="quickLogin('enterprise')">
            <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center mb-1">
              <span class="text-2xl">🏢</span>
            </div>
            <span class="text-xs" style="color: #43474f;">企业用户</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Agreement -->
    <p class="text-xs text-center text-white/60 mt-4">
      登录即表示同意
      <a href="#" class="underline">《用户服务协议》</a>
      和
      <a href="#" class="underline">《隐私政策》</a>
    </p>
  </main>

  <script>
    var API_BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    var countdown = 0;

    function sendCode() {
      var phone = document.getElementById('phone').value;
      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }

      fetch(API_BASE + '/auth/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        alert('验证码已发送');
        startCountdown();
      })
      .catch(function(err) {
        alert('发送失败: ' + err.message);
      });
    }

    function startCountdown() {
      var btn = document.getElementById('sendCodeBtn');
      countdown = 60;
      btn.textContent = countdown + 's';
      btn.style.pointerEvents = 'none';

      var timer = setInterval(function() {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.textContent = '发送验证码';
          btn.style.pointerEvents = 'auto';
        } else {
          btn.textContent = countdown + 's';
        }
      }, 1000);
    }

    function handleLogin(e) {
      e.preventDefault();
      var phone = document.getElementById('phone').value;
      var smsCode = document.getElementById('smsCode').value;
      var btn = document.getElementById('loginBtn');

      if (!phone || !smsCode) {
        alert('请输入手机号和验证码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: phone,
          code: smsCode,
          role: 'customer'
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.accessToken) {
          localStorage.setItem('customer_token', data.accessToken);
          localStorage.setItem('customer_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          alert(data.message || '登录失败');
          btn.disabled = false;
          btn.textContent = '登录';
        }
      })
      .catch(function(err) {
        alert('登录失败: ' + err.message);
        btn.disabled = false;
        btn.textContent = '登录';
      });
    }

    function quickLogin(type) {
      var phone = '13800138000';
      var code = '000000';

      fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: phone,
          code: code,
          role: 'customer'
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.accessToken) {
          localStorage.setItem('customer_token', data.accessToken);
          localStorage.setItem('customer_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          alert('登录失败');
        }
      })
      .catch(function(err) {
        alert('登录失败: ' + err.message);
      });
    }
  </script>
</body>
</html>
