<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 - 设备报修门户</title>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background: linear-gradient(135deg, #1890ff 0%, #0052d9 100%);
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/auth-reference.css"><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/login-screen.css"></head>
<body class="auth-reference login-screen" data-role="customer">
  <main class="login-main">
    <header class="login-brand"><img src="/brand/laser-service-mark.svg" width="40" height="40" alt="激光设备服务"><div><strong>激光设备服务</strong><span>设备服务</span></div></header>
    <section class="login-intro"><p class="login-eyebrow">设备售后 · 随时在身边</p><h1>设备服务，<br>从这里开始</h1><p class="login-description">登录后进入你的服务首页或企业工作台。</p></section>
    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
      <div id="organizationContext"></div>
      <div class="login-methods" role="tablist" aria-label="登录方式"><button type="button" role="tab" aria-selected="true" data-login-mode="code">验证码登录</button><button type="button" role="tab" aria-selected="false" data-login-mode="password">密码登录</button></div>
      <div id="phoneLoginFields"><label class="login-field" for="phone"><span>手机号</span><input type="tel" inputmode="tel" autocomplete="tel" id="phone" placeholder="请输入手机号" maxlength="11" value="13698000001"></label>
      <label class="login-field" for="smsCode"><span>验证码</span><div class="login-code-row"><input type="text" inputmode="numeric" autocomplete="one-time-code" id="smsCode" placeholder="请输入验证码" maxlength="6" value="000000"><button type="button" id="sendCodeBtn" onclick="sendCode()">获取验证码</button></div></label>
      </div><div id="passwordLoginFields" hidden><label class="login-field" for="username"><span>登录账号</span><input name="username" id="username" autocomplete="username" placeholder="请输入登录账号" maxlength="64" disabled></label><label class="login-field" for="password"><span>密码</span><input name="password" id="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="128" disabled></label></div>
      <button type="submit" id="loginBtn">登录</button>
      <p class="login-demo">演示体验 · 已预填账号，验证码 000000</p>
    </form>

    <p class="login-bottom">还没有账号？<a href="register.html">立即注册</a></p>
    <p class="login-legal">登录即表示同意 <a href="#">用户服务协议</a> 与 <a href="#">隐私政策</a></p>
  </main>

  <script src="/organization-login.js"></script>
  <script>
    var API_BASE = window.APP_API_BASE;
    var organizationLogin = window.createOrganizationLogin('customer');
    var countdown = 0,loginMode='code';
    document.querySelectorAll('[data-login-mode]').forEach(button=>button.onclick=function(){loginMode=this.dataset.loginMode;document.querySelectorAll('[data-login-mode]').forEach(b=>b.setAttribute('aria-selected',String(b===this)));document.getElementById('phoneLoginFields').hidden=loginMode!=='code';document.getElementById('passwordLoginFields').hidden=loginMode!=='password';document.querySelectorAll('#phoneLoginFields input').forEach(input=>input.disabled=loginMode!=='code');document.querySelectorAll('#passwordLoginFields input').forEach(input=>input.disabled=loginMode!=='password');document.getElementById('organizationError').textContent='';document.querySelector('.login-demo').hidden=loginMode!=='code';});

    if(new URLSearchParams(location.search).get('method')==='password')document.querySelector('[data-login-mode=password]').click();
    function sendCode() {
      var phone = document.getElementById('phone').value;
      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }

      organizationLogin.sendCode(phone)
      .then(function(data) {
        alert('验证码已发送');
        startCountdown();
      })
      .catch(function(err) {
        alert('发送失败: ' + err.message);
      });
    }

    function startCountdown() {
      var btn = document.getElementById('sendCodeBtn');
      countdown = 60;
      btn.textContent = countdown + 's';
      btn.style.pointerEvents = 'none';btn.disabled=true;

      var timer = setInterval(function() {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.textContent = '发送验证码';
          btn.style.pointerEvents = 'auto';btn.disabled=false;
        } else {
          btn.textContent = countdown + 's';
        }
      }, 1000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      if(loginMode==='password')await organizationLogin.password(document.getElementById('username').value.trim(),document.getElementById('password').value);else await organizationLogin.login(document.getElementById('phone').value.trim(),document.getElementById('smsCode').value);
    }
  </script>
</body>
</html>
