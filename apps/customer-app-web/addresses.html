<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>常用地址</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: 340px;
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="bg-surface pb-20">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">常用地址</h1>
    <button class="text-primary" onclick="showAddModal()">
      <span class="material-symbols-outlined">add</span>
    </button>
  </header>

  <main class="pt-14 px-4 space-y-3">
    <!-- Loading -->
    <div id="loading" class="text-center py-10 text-on-surface-variant">
      <span class="material-symbols-outlined animate-spin">progress_activity</span>
      <p class="mt-2">加载中...</p>
    </div>

    <!-- Address List -->
    <section class="space-y-3 mt-4 hidden" id="addressListSection">
      <div id="addressList"></div>
    </section>

    <!-- Empty State -->
    <section class="hidden text-center py-10" id="emptyState">
      <span class="material-symbols-outlined text-5xl text-on-surface-variant">location_off</span>
      <p class="mt-4 text-on-surface-variant">暂无地址</p>
      <p class="text-sm text-on-surface-variant mt-1">点击右上角添加地址</p>
    </section>

    <!-- Hint -->
    <section class="bg-white border border-dashed border-outline-variant rounded-xl p-4 text-center hidden" id="addHint">
      <p class="text-sm text-on-surface-variant">
        默认地址将自动填充到报修表单，方便您快速报修。
      </p>
    </section>
  </main>

  <!-- Add/Edit Address Modal -->
  <div id="addressModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-lg" id="modalTitle">添加地址</h3>
        <button onclick="hideModal()" class="text-on-surface-variant hover:text-on-surface">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <input type="hidden" id="addressId" />

      <div class="form-group">
        <label class="text-sm text-on-surface-variant mb-1 block">所在地区</label>
        <div class="flex gap-2">
          <select id="province" class="flex-1 px-3 py-2 border border-outline-variant rounded-lg text-sm bg-white">
            <option value="">请选择省</option>
          </select>
          <select id="city" class="flex-1 px-3 py-2 border border-outline-variant rounded-lg text-sm bg-white">
            <option value="">请选择市</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="text-sm text-on-surface-variant mb-1 block">区/县</label>
        <input type="text" id="district" class="w-full px-3 py-2 border border-outline-variant rounded-lg text-sm" placeholder="区/县" />
      </div>

      <div class="form-group">
        <label class="text-sm text-on-surface-variant mb-1 block">详细地址</label>
        <input type="text" id="detail" class="w-full px-3 py-2 border border-outline-variant rounded-lg text-sm" placeholder="街道、门牌号等" />
      </div>

      <div class="form-group">
        <label class="text-sm text-on-surface-variant mb-1 block">联系人</label>
        <input type="text" id="contactName" class="w-full px-3 py-2 border border-outline-variant rounded-lg text-sm" placeholder="联系人姓名" />
      </div>

      <div class="form-group">
        <label class="text-sm text-on-surface-variant mb-1 block">联系电话</label>
        <input type="tel" id="contactPhone" class="w-full px-3 py-2 border border-outline-variant rounded-lg text-sm" placeholder="手机号" />
      </div>

      <div class="form-group">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="isDefault" class="w-4 h-4" style="accent-color: #1890ff;" />
          <span class="text-sm">设为默认地址</span>
        </label>
      </div>

      <p id="formError" class="text-error text-sm mb-3 hidden"></p>

      <div class="flex gap-3">
        <button onclick="hideModal()" class="flex-1 py-3 border border-outline-variant rounded-lg text-sm">取消</button>
        <button onclick="submitAddress()" class="flex-1 py-3 bg-primary text-white rounded-lg text-sm font-medium">保存</button>
      </div>

      <button onclick="deleteAddressConfirm()" id="deleteBtn" class="w-full mt-3 py-3 text-error text-sm hidden">删除地址</button>
    </div>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('home')">
      <span class="material-symbols-outlined" style="font-size: 28px;">home</span>
      <span class="text-xs mt-1">首页</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('orders')">
      <span class="material-symbols-outlined" style="font-size: 28px;">receipt_long</span>
      <span class="text-xs mt-1">工单</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('chat')">
      <span class="material-symbols-outlined" style="font-size: 28px;">support_agent</span>
      <span class="text-xs mt-1">客服</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-primary relative" onclick="navigateTo('profile')">
      <div class="absolute top-2 w-12 h-8 rounded-full -z-10" style="background-color: #e6f7ff; opacity: 1;"></div>
      <span class="material-symbols-outlined fill" style="font-size: 28px;">person</span>
      <span class="text-xs mt-1 font-medium">我的</span>
    </button>
  </nav>

    document.addEventListener('DOMContentLoaded', function() {
      loadAddresses();

    });

    function initProvinceSelect() {
      var provinceSelect = document.getElementById('province');
      provinces.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        provinceSelect.appendChild(opt);
      });
      provinceSelect.addEventListener('change', function() {
        updateCities(this.value);
      });
    }

    function updateCities(province) {
      var citySelect = document.getElementById('city');
      var districtSelect = document.getElementById('district');
      citySelect.innerHTML = '<option value="">请选择</option>';
      districtSelect.innerHTML = '<option value="">请选择</option>';

      if (cities[province]) {
        cities[province].forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          citySelect.appendChild(opt);
        });
      }
    }

    function loadAddresses() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('addressListSection').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('addHint').classList.add('hidden');

      fetch(API_BASE + '/customer/addresses', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(res) { return res.json(); })
        .then(function(addresses) {
          document.getElementById('loading').classList.add('hidden');
          renderAddresses(addresses || []);
        }).catch(function(e) {
          console.error(e);
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('emptyState').classList.remove('hidden');
          document.getElementById('addHint').classList.remove('hidden');
        });
    }

    function renderAddresses(addresses) {
      var listEl = document.getElementById('addressList');
      var listSection = document.getElementById('addressListSection');
      var emptyState = document.getElementById('emptyState');
      var addHint = document.getElementById('addHint');

      if (addresses.length === 0) {
        listSection.classList.add('hidden');
        emptyState.classList.remove('hidden');
        addHint.classList.remove('hidden');
        return;
      }

      listSection.classList.remove('hidden');
      emptyState.classList.add('hidden');
      addHint.classList.remove('hidden');

      listEl.innerHTML = addresses.map(function(addr) {
        var isDefault = addr.isDefault ? '<span class="px-2 py-0.5 rounded text-xs font-medium" style="background-color: #e6f7ff; color: #1890ff;">默认</span>' : '';
        var fullAddress = (addr.province || '') + (addr.city || '') + (addr.district || '') + (addr.detail || '');
        var phoneMask = addr.contactPhone ? addr.contactPhone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2') : '';

        return '<div class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">' +
          '<div class="flex items-start justify-between">' +
            '<div class="flex-1">' +
              '<div class="flex items-center gap-2 mb-2">' +
                isDefault +
                '<h3 class="font-semibold" style="color: #111827;">' + (addr.label || '地址') + '</h3>' +
              '</div>' +
              '<p class="text-sm text-on-surface-variant">' + fullAddress + '</p>' +
              '<p class="text-xs text-on-surface-variant mt-1">联系人：' + (addr.contactName || '') + ' | ' + phoneMask + '</p>' +
            '</div>' +
            '<button class="text-primary" onclick="editAddress(\'' + addr.id + '\')">' +
              '<span class="material-symbols-outlined">edit</span>' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function showAddModal() {
      document.getElementById('modalTitle').textContent = '添加地址';
      document.getElementById('addressId').value = '';
      document.getElementById('province').value = '';
      document.getElementById('city').innerHTML = '<option value="">请选择市</option>';
      document.getElementById('district').value = '';
      document.getElementById('detail').value = '';
      document.getElementById('contactName').value = '';
      document.getElementById('contactPhone').value = '';
      document.getElementById('isDefault').checked = false;
      document.getElementById('deleteBtn').classList.add('hidden');
      document.getElementById('formError').classList.add('hidden');
      document.getElementById('addressModal').classList.remove('hidden');
    }

    function editAddress(id) {
      fetch(API_BASE + '/customer/addresses/' + id, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(res) { return res.json(); })
        .then(function(addr) {
          document.getElementById('modalTitle').textContent = '编辑地址';
          document.getElementById('addressId').value = addr.id;
          document.getElementById('province').value = addr.province || '';
          // Update cities based on province
          var citySelect = document.getElementById('city');
          citySelect.innerHTML = '<option value="">请选择市</option>';
          if (cities[addr.province]) {
            cities[addr.province].forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c;
              opt.textContent = c;
              citySelect.appendChild(opt);
            });
          }
          document.getElementById('city').value = addr.city || '';
          document.getElementById('district').value = addr.district || '';
          document.getElementById('detail').value = addr.detail || '';
          document.getElementById('contactName').value = addr.contactName || '';
          document.getElementById('contactPhone').value = addr.contactPhone || '';
          document.getElementById('isDefault').checked = addr.isDefault || false;
          document.getElementById('deleteBtn').classList.remove('hidden');
          document.getElementById('formError').classList.add('hidden');
          document.getElementById('addressModal').classList.remove('hidden');
        }).catch(function(e) {
          alert('获取地址信息失败');
        });
    }

    function hideModal() {
      document.getElementById('addressModal').classList.add('hidden');
    }

    function submitAddress() {
      var id = document.getElementById('addressId').value;
      var province = document.getElementById('province').value;
      var city = document.getElementById('city').value;
      var district = document.getElementById('district').value.trim();
      var detail = document.getElementById('detail').value.trim();
      var contactName = document.getElementById('contactName').value.trim();
      var contactPhone = document.getElementById('contactPhone').value.trim();
      var isDefault = document.getElementById('isDefault').checked;

      if (!province) {
        document.getElementById('formError').textContent = '请选择省份';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }
      if (!city) {
        document.getElementById('formError').textContent = '请选择城市';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }
      if (!district) {
        document.getElementById('formError').textContent = '请输入区/县';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }
      if (!detail) {
        document.getElementById('formError').textContent = '请输入详细地址';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }
      if (!contactName) {
        document.getElementById('formError').textContent = '请输入联系人';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }
      if (!contactPhone) {
        document.getElementById('formError').textContent = '请输入联系电话';
        document.getElementById('formError').classList.remove('hidden');
        return;
      }

      var data = { province, city, district, detail, contactName, contactPhone, isDefault };
      var url = id ? API_BASE + '/customer/addresses/' + id : API_BASE + '/customer/addresses';
      var method = id ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(data)
      }).then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.id) {
            hideModal();
            loadAddresses();
          } else {
            document.getElementById('formError').textContent = result.message || '保存失败';
            document.getElementById('formError').classList.remove('hidden');
          }
        }).catch(function(e) {
          document.getElementById('formError').textContent = '网络错误，请重试';
          document.getElementById('formError').classList.remove('hidden');
        });
    }

    function deleteAddressConfirm() {
      var id = document.getElementById('addressId').value;
      if (!id) return;

      if (confirm('确定要删除这个地址吗？')) {
        fetch(API_BASE + '/customer/addresses/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(res) { return res.json(); })
          .then(function(result) {
            hideModal();
            loadAddresses();
          }).catch(function(e) {
            alert('删除失败');
          });
      }
    }

    function navigateTo(page) {
      var pages = {
        'home': 'index.html',
        'orders': 'orders.html',
        'chat': 'chat.html',
        'profile': 'profile.html'
      };
      if (pages[page]) {
        window.location.href = pages[page];
      }
    }
  </script>
</body>
</html>
