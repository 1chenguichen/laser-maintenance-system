<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>退款申请</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/main.css" rel="stylesheet">
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1890ff",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474f",
            "outline": "#737780",
            "outline-variant": "#c3c6d1",
            "secondary": "#52c41a",
            "error": "#ff4d4f",
            "warning": "#faad14"
          },
          fontFamily: {
            display: ["IBM Plex Sans"],
            body: ["Noto Sans"],
            mono: ["JetBrains Mono"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #f7f9fb;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<link rel="stylesheet" href="/product-design.css?v=2"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><script src="/brand/brand.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head>
<body class="product-screen bg-surface pb-24 mobile-system" data-role="customer" data-page="refund">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <button class="text-primary" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-semibold text-base" style="color: #111827;">退款申请</h1>
    <div class="w-10"></div>
  </header>

  <main class="pt-14 px-4 space-y-4">
    <!-- Notice -->
    <section class="p-4 rounded-xl" style="background-color: #fffbe6; border: 1px solid #ffe58f;">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined fill" style="color: #faad14;">info</span>
        <div class="text-sm" style="color: #ad6800;">
          <p class="font-medium mb-1">退款说明</p>
          <ul class="list-disc list-inside space-y-1 text-xs">
            <li>已支付的工单可提交退款申请</li>
            <li>申请金额不得超过该工单已支付金额</li>
            <li>退款申请需客服审核，提交不代表资金已退回</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Order Selection -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">选择工单</h3>
      <select id="orderSelect" class="w-full p-3 border border-outline-variant rounded-lg text-sm bg-white" onchange="loadOrderInfo()">
        <option value="">请选择要退款的工单</option>
      </select>
    </section>

    <!-- Order Details (dynamic) -->
    <section id="orderDetails" class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm hidden">
      <h3 class="font-semibold mb-3" style="color: #111827;">工单信息</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工单编号</span>
          <span class="font-mono" id="refundOrderNo">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">设备型号</span>
          <span id="refundDevice">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">已付金额</span>
          <span class="font-bold" style="color: #1890ff;" id="refundPaid">¥ 0.00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">退款金额</span>
          <span class="font-bold" style="color: #52c41a;" id="refundAmount">¥ 0.00</span>
        </div>
      </div>
    </section>

    <!-- Refund Reason -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">退款原因</h3>
      <div class="space-y-2">
        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" style="border: 1px solid #e5e7eb;">
          <input type="radio" name="refund_reason" value="cancel" class="form-radio" style="accent-color: #1890ff;">
          <span class="text-sm" style="color: #111827;">取消维修</span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" style="border: 1px solid #e5e7eb;">
          <input type="radio" name="refund_reason" value="delay" class="form-radio" style="accent-color: #1890ff;">
          <span class="text-sm" style="color: #111827;">工程师响应太慢</span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" style="border: 1px solid #e5e7eb;">
          <input type="radio" name="refund_reason" value="quote" class="form-radio" style="accent-color: #1890ff;">
          <span class="text-sm" style="color: #111827;">报价过高</span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors" style="border: 1px solid #e5e7eb;">
          <input type="radio" name="refund_reason" value="other" class="form-radio" style="accent-color: #1890ff;">
          <span class="text-sm" style="color: #111827;">其他原因</span>
        </label>
      </div>
    </section>

    <!-- Additional Notes -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">补充说明</h3>
      <textarea id="refundNotes" class="w-full p-3 border border-outline-variant rounded-lg text-sm" rows="3" placeholder="请详细描述退款原因（选填）"></textarea>
    </section>

    <!-- Refund Account -->
    <section class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="font-semibold mb-3" style="color: #111827;">退款账户</h3>
      <div class="flex items-center justify-between p-3 rounded-lg" style="background-color: #f7f9fb; border: 1px solid #e5e7eb;">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined fill" style="color: #52c41a;">account_balance_wallet</span>
          <span class="text-sm" style="color: #111827;">原路退回</span>
        </div>
        <span class="text-xs text-on-surface-variant">1-3个工作日到账</span>
      </div>
    </section>
  </main>

  <!-- Bottom Action -->
  <div class="fixed bottom-[80px] w-full max-w-[414px] left-1/2 -translate-x-1/2 bg-white border-t border-outline-variant px-4 py-4 z-40">
    <button id="submitBtn" class="w-full py-3 text-white font-medium rounded-lg disabled:opacity-50" style="background-color: #1890ff;" onclick="submitRefund()" disabled>
      提交退款申请
    </button>
  </div>

  <!-- Bottom Nav Bar -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('home')">
      <span class="material-symbols-outlined" style="font-size: 28px;">home</span>
      <span class="text-xs mt-1">首页</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-primary relative" onclick="navigateTo('orders')">
      <div class="absolute top-2 w-12 h-8 rounded-full -z-10" style="background-color: #e6f7ff; opacity: 1;"></div>
      <span class="material-symbols-outlined fill" style="font-size: 28px;">receipt_long</span>
      <span class="text-xs mt-1 font-medium">工单</span>
    </button>
    <button class="flex-1 flex flex-col items-center justify-center py-1.5 text-on-surface-variant" onclick="navigateTo('profile')">
      <span class="material-symbols-outlined" style="font-size: 28px;">person</span>
      <span class="text-xs mt-1">我的</span>
    </button>
  </nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('customer_token');
    var selectedOrder = null;

    if (!token) {
      window.location.href = 'login.html';
    }

    document.querySelectorAll('input[name="refund_reason"]').forEach(function(radio) {
      radio.addEventListener('change', function() {
        document.getElementById('submitBtn').disabled = !selectedOrder;
      });
    });

    var refundOrders = [];
    async function loadRefundOrders() {
      try {
        var orders = await window.readApiResponse(await fetch(API_BASE + '/customer/work-orders', { headers: { Authorization: 'Bearer ' + token } }));
        refundOrders = orders.filter(function (o) { return ['REPAIRING','PENDING_FINAL_PAYMENT','COMPLETED'].includes(o.status); });
        var select = document.getElementById('orderSelect');
        select.replaceChildren(new Option(refundOrders.length ? '请选择要退款的工单' : '暂无可退款工单', ''));
        refundOrders.forEach(function (o) { select.add(new Option(o.orderNo + ' - ' + (o.device ? o.device.model : ''), o.id)); });
      } catch (err) { alert(err.message); }
    }
    function loadOrderInfo() {
      var id = document.getElementById('orderSelect').value;
      selectedOrder = refundOrders.find(function (o) { return o.id === id; }) || null;
      document.getElementById('orderDetails').classList.toggle('hidden', !selectedOrder);
      if (!selectedOrder) { document.getElementById('submitBtn').disabled = true; return; }
      var paid = Number(selectedOrder.prepayAmount || 0) + Number(selectedOrder.finalPaymentAmount || 0);
      document.getElementById('refundOrderNo').textContent = selectedOrder.orderNo;
      document.getElementById('refundDevice').textContent = selectedOrder.device ? selectedOrder.device.model : '—';
      document.getElementById('refundPaid').textContent = '¥ ' + paid.toFixed(2);
      document.getElementById('refundAmount').textContent = '¥ ' + paid.toFixed(2);
      document.getElementById('submitBtn').disabled = !document.querySelector('input[name="refund_reason"]:checked');
    }
    async function submitRefund() {
      var reason = document.querySelector('input[name="refund_reason"]:checked');
      if (!selectedOrder || !reason) { alert('请选择工单和退款原因'); return; }
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        await window.readApiResponse(await fetch(API_BASE + '/customer/refund', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ workOrderId: selectedOrder.id, amount: Number(selectedOrder.prepayAmount || 0) + Number(selectedOrder.finalPaymentAmount || 0), reason: reason.value + ' ' + document.getElementById('refundNotes').value })
        }));
        alert('退款申请已提交，请等待客服审核');
        window.location.href = 'orders.html';
      } catch (err) { alert(err.message); btn.disabled = false; }
    }
    document.addEventListener('DOMContentLoaded', loadRefundOrders);

    function navigateTo(page) {
      var pages = {
        'home': 'index.html',
        'orders': 'orders.html',
        'profile': 'profile.html'
      };
      if (pages[page]) {
        window.location.href = pages[page];
      }
    }
  </script>
</body>
</html>
