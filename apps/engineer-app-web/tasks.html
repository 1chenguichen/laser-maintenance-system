<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的任务 - 工程师端 · 智修工</title>





<script src="/mobile-navigation.js" defer></script><script src="/mobile-continuity.js" defer></script><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><script src="/engineer-navigation.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-3004899dce4a.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-20 mobile-system" data-role="engineer" data-refined="true" data-page="tasks">
  <!-- Top App Bar -->
  <header class="engineer-page-header"><a class="engineer-back" href="workbench.html" aria-label="返回上一页"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="engineer-header-title">我的工单</h1><span class="engineer-header-space" aria-hidden="true"></span></header>

  <!-- Tab Navigation -->
  <div class="fixed top-14 w-full z-40 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="flex">
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="pending">
        待上门
        <span id="tab-pending-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="working">
        维修中
        <span id="tab-working-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="pendingFinal">
        待尾款
        <span id="tab-pendingFinal-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="completed">
        已完工
        <span id="tab-completed-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="pt-28 px-4 space-y-4">
    <section data-engineer-companies aria-live="polite" aria-label="所属企业" style="background:#f0f8f3;border:1px solid #d5e8dc;border-radius:12px;padding:14px 16px;margin-top:16px"><p style="margin:0;font-size:14px;color:#52665a">正在核实所属企业…</p></section>
    <div id="taskList">
      <div class="text-center py-12 text-on-surface-variant">加载中...</div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="mobile-navigation" aria-label="主要导航"><a href="workbench.html"><span class="material-symbols-outlined" aria-hidden="true">home</span><span>工作台</span></a><a href="opportunities.html"><span class="material-symbols-outlined" aria-hidden="true">bolt</span><span>接单</span></a><a href="platform-orders.html"><span class="material-symbols-outlined" aria-hidden="true">assignment</span><span>工单</span></a><a href="learning.html"><span class="material-symbols-outlined" aria-hidden="true">school</span><span>学习</span></a><a href="profile.html"><span class="material-symbols-outlined" aria-hidden="true">person</span><span>我的</span></a></nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');
    var currentTab = 'pending';
    var taskData = { pending: [], working: [], pendingFinal: [], completed: [] };

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadTasks();
      setupTabs();
      setInterval(function () { if (!document.hidden) loadTasks(); }, 5000);
    });

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.tab').forEach(function(t) {
            t.classList.remove('active');
            t.style.color = '#43474f';
            var indicator = t.querySelector('.tab-indicator');
            if (indicator) indicator.classList.add('hidden');
          });
          this.classList.add('active');
          this.style.color = '#006d33';
          var indicator = this.querySelector('.tab-indicator');
          if (indicator) indicator.classList.remove('hidden');
          currentTab = this.dataset.tab;
          renderTasks();
        });
      });
      // Init tab from hash or default to pending
      var hash = window.location.hash.slice(1);
      var initialTab = ['pending', 'working', 'pendingFinal', 'completed'].includes(hash) ? hash : 'pending';
      document.querySelector('.tab[data-tab="' + initialTab + '"]').click();
    }

    function loadTasks() {
      return Promise.all([
        fetch(API_BASE + '/engineer/designated-orders', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=DISPATCHED', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=ACCEPTED', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=PENDING_PAYMENT', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=REPAIRING', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=PENDING_FINAL_PAYMENT', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse),
        fetch(API_BASE + '/engineer/orders?status=COMPLETED', { headers: { 'Authorization': 'Bearer ' + token } }).then(window.readApiResponse)
      ])
      .then(function(results) {
        taskData.pending = [...results[0], ...results[1]];
        taskData.working = [...results[2], ...results[3], ...results[4]];
        taskData.pendingFinal = results[5];
        taskData.completed = results[6];

        document.getElementById('tab-pending-count').textContent = taskData.pending.length || '';
        document.getElementById('tab-working-count').textContent = taskData.working.length || '';
        document.getElementById('tab-pendingFinal-count').textContent = taskData.pendingFinal.length || '';
        document.getElementById('tab-completed-count').textContent = taskData.completed.length || '';

        renderTasks();
      })
      .catch(function(err) {
        document.getElementById('taskList').innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载失败</div>';
      });
    }

    function renderTasks() {
      var container = document.getElementById('taskList');
      var tasks = taskData[currentTab];

      if (tasks.length === 0) {
        var emptyText = currentTab === 'pending' ? '暂无待上门任务' :
                        currentTab === 'working' ? '暂无维修中任务' :
                        currentTab === 'pendingFinal' ? '暂无待尾款任务' : '暂无已完工任务';
        container.innerHTML = '<div class="text-center py-12">' +
          '<span class="material-symbols-outlined text-5xl text-on-surface-variant">task_alt</span>' +
          '<p class="mt-4 text-on-surface-variant">' + emptyText + '</p></div>';
        return;
      }

      var html = '';
      tasks.forEach(function(task) {
        var addr = task.address ? [task.address.city, task.address.district, task.address.detail].filter(Boolean).join('') : '-';
        var statusBadge, statusClass;
        if (currentTab === 'pending') {
          statusBadge = task.status === 'PENDING' ? '指定待接单' : '今日任务';
          statusClass = 'bg-primary-container text-primary';
        } else if (currentTab === 'working') {
          if (task.status === 'ACCEPTED') {
            statusBadge = '已上门';
            statusClass = 'bg-primary-container text-primary';
          } else if (task.status === 'PENDING_PAYMENT') {
            statusBadge = '报价中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          } else if (task.status === 'REPAIRING') {
            statusBadge = '维修中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          } else {
            statusBadge = '维修中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          }
        } else if (currentTab === 'pendingFinal') {
          statusBadge = '待尾款';
          statusClass = 'bg-warning-container text-[#ad6800]';
        } else {
          statusBadge = '已完工';
          statusClass = 'bg-gray-100 text-on-surface';
        }

        html += '<article class="bg-white rounded-xl p-4 border border-outline-variant mb-4">';
        if(task.serviceName)html+='<p class="text-xs mb-2" style="color:#7b8b9e">服务企业：'+window.escapeHtml(task.serviceName)+'</p>';
        html += '<div class="flex justify-between items-center mb-3">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="px-2 py-1 rounded text-xs font-semibold ' + statusClass + '">' + statusBadge + '</span>';
        html += '<span class="text-xs text-on-surface-variant font-mono">' + (task.orderNo || task.id) + '</span>';
        html += '</div>';
        if (task.appointmentTime) {
          html += '<span class="text-xs text-on-surface-variant">预约: ' + task.appointmentTime + '</span>';
        }
        html += '</div>';

        html += '<h3 class="font-semibold mb-3" style="color: #111827;">' + escapeHtml((task.faultType || '维修任务')) + '</h3>';

        html += '<div class="space-y-2 text-sm text-on-surface-variant mb-4">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">devices</span>';
        html += '<span>' + escapeHtml((task.device ? task.device.model : '-')) + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">person</span>';
        html += '<span>' + escapeHtml((task.customer ? task.customer.name : '-')) + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">location_on</span>';
        html += '<span>' + escapeHtml(addr) + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<div class="flex justify-between items-center pt-3 border-t border-outline-variant">';
        html += '<div class="text-xs text-on-surface-variant">';
        html += '<span class="material-symbols-outlined text-sm" style="vertical-align: middle;">person</span> ';
        html += (task.customer ? task.customer.name : '-') + ' - ' + (task.customer ? task.customer.phone : '-');
        html += '</div>';

        if (currentTab === 'pending' && task.status === 'PENDING') {
          html += '<button class="engineer-primary px-4 py-2 text-white text-sm rounded-lg bg-primary" onclick="acceptDesignated(\'' + task.id + '\')">接受指派</button>';
        } else if (currentTab === 'pending') {
          html += '<button class="engineer-primary px-4 py-2 text-white text-sm font-medium rounded-lg" style="background-color: #006d33;" onclick="startWork(\'' + task.id + '\')">开始打卡</button>';
        } else {
          html += '<button class="px-4 py-2 border text-sm font-medium rounded-lg" style="border-color: #006d33; color: #006d33;" onclick="viewDetail(\'' + task.id + '\')">查看详情</button>';
        }
        html += '</div>';
        html += '</article>';
      });

      container.innerHTML = html;
    }

    async function acceptDesignated(orderId) {
      try {
        await window.readApiResponse(await fetch(API_BASE + '/engineer/accept-designated', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ workOrderId: orderId })
        }));
        await loadTasks();
      } catch (err) { window.EngineerFeedback.notice(err.message); }
    }

    function startWork(orderId) {
      fetch(API_BASE + '/engineer/orders/' + orderId + '/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        window.EngineerFeedback.notice('已开始作业');
        window.location.href = 'tasks.html';
      })
      .catch(function(err) {
        window.EngineerFeedback.notice('操作失败: ' + err.message);
      });
    }

    function viewDetail(orderId) {
      window.location.href = 'task-detail.html#' + orderId;
    }
  </script>
</body>
</html>
