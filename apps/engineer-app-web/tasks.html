<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的任务 - 工程师端</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006d33",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "on-surface": "#191c1e"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface pb-20">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="w-10"></div>
    <h1 class="font-semibold text-base" style="color: #111827;">我的任务</h1>
    <div class="w-10"></div>
  </header>

  <!-- Tab Navigation -->
  <div class="fixed top-14 w-full z-40 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="flex">
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="pending">
        待上门
        <span id="tab-pending-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="working">
        维修中
        <span id="tab-working-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="pendingFinal">
        待尾款
        <span id="tab-pendingFinal-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
      <button class="tab flex-1 py-3 text-sm font-medium relative" data-tab="completed">
        已完工
        <span id="tab-completed-count" class="ml-1 px-1.5 py-0.5 rounded-full text-xs font-semibold bg-primary text-white"></span>
        <div class="tab-indicator absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-0.5 rounded-full bg-primary hidden"></div>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="pt-28 px-4 space-y-4">
    <div id="taskList">
      <div class="text-center py-12 text-on-surface-variant">加载中...</div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <a href="grab.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">bolt</span>
      <span class="nav-label">抢单</span>
    </a>
    <a href="tasks.html" class="nav-item active">
      <span class="material-symbols-outlined fill nav-icon">assignment</span>
      <span class="nav-label">任务</span>
    </a>
    <a href="ai-assistant.html" class="nav-item" style="margin-top: -12px;">
      <img src="ai-icon.png" alt="AI" style="width: 77px; height: 77px; object-fit: contain;">
    </a>
    <a href="inventory.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">inventory_2</span>
      <span class="nav-label">移动仓</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">person</span>
      <span class="nav-label">我的</span>
    </a>
  </nav>

  <script>
    var API_BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    var token = localStorage.getItem('engineer_token');
    var currentTab = 'pending';
    var taskData = { pending: [], working: [], pendingFinal: [], completed: [] };

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadTasks();
      setupTabs();
    });

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.tab').forEach(function(t) {
            t.classList.remove('active');
            t.style.color = '#43474f';
            var indicator = t.querySelector('.tab-indicator');
            if (indicator) indicator.classList.add('hidden');
          });
          this.classList.add('active');
          this.style.color = '#006d33';
          var indicator = this.querySelector('.tab-indicator');
          if (indicator) indicator.classList.remove('hidden');
          currentTab = this.dataset.tab;
          renderTasks();
        });
      });
      // Init tab from hash or default to pending
      var hash = window.location.hash.slice(1);
      var initialTab = ['pending', 'working', 'pendingFinal', 'completed'].includes(hash) ? hash : 'pending';
      document.querySelector('.tab[data-tab="' + initialTab + '"]').click();
    }

    function loadTasks() {
      Promise.all([
        fetch(API_BASE + '/engineer/orders?status=DISPATCHED', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); }),
        fetch(API_BASE + '/engineer/orders?status=ACCEPTED', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); }),
        fetch(API_BASE + '/engineer/orders?status=PENDING_PAYMENT', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); }),
        fetch(API_BASE + '/engineer/orders?status=REPAIRING', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); }),
        fetch(API_BASE + '/engineer/orders?status=PENDING_FINAL_PAYMENT', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); }),
        fetch(API_BASE + '/engineer/orders?status=COMPLETED', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r) { return r.json(); })
      ])
      .then(function(results) {
        taskData.pending = Array.isArray(results[0]) ? results[0] : [];
        taskData.working = [...(Array.isArray(results[1]) ? results[1] : []), ...(Array.isArray(results[2]) ? results[2] : []), ...(Array.isArray(results[3]) ? results[3] : [])];
        taskData.pendingFinal = Array.isArray(results[4]) ? results[4] : [];
        taskData.completed = Array.isArray(results[5]) ? results[5] : [];

        document.getElementById('tab-pending-count').textContent = taskData.pending.length || '';
        document.getElementById('tab-working-count').textContent = taskData.working.length || '';
        document.getElementById('tab-pendingFinal-count').textContent = taskData.pendingFinal.length || '';
        document.getElementById('tab-completed-count').textContent = taskData.completed.length || '';

        renderTasks();
      })
      .catch(function(err) {
        document.getElementById('taskList').innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载失败</div>';
      });
    }

    function renderTasks() {
      var container = document.getElementById('taskList');
      var tasks = taskData[currentTab];

      if (tasks.length === 0) {
        var emptyText = currentTab === 'pending' ? '暂无待上门任务' :
                        currentTab === 'working' ? '暂无维修中任务' :
                        currentTab === 'pendingFinal' ? '暂无待尾款任务' : '暂无已完工任务';
        container.innerHTML = '<div class="text-center py-12">' +
          '<span class="material-symbols-outlined text-5xl text-on-surface-variant">task_alt</span>' +
          '<p class="mt-4 text-on-surface-variant">' + emptyText + '</p></div>';
        return;
      }

      var html = '';
      tasks.forEach(function(task) {
        var addr = task.address ? [task.address.city, task.address.district, task.address.detail].filter(Boolean).join('') : '-';
        var statusBadge, statusClass;
        if (currentTab === 'pending') {
          statusBadge = '今日任务';
          statusClass = 'bg-primary-container text-primary';
        } else if (currentTab === 'working') {
          if (task.status === 'ACCEPTED') {
            statusBadge = '已上门';
            statusClass = 'bg-primary-container text-primary';
          } else if (task.status === 'PENDING_PAYMENT') {
            statusBadge = '报价中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          } else if (task.status === 'REPAIRING') {
            statusBadge = '维修中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          } else {
            statusBadge = '维修中';
            statusClass = 'bg-warning-container text-[#ad6800]';
          }
        } else if (currentTab === 'pendingFinal') {
          statusBadge = '待尾款';
          statusClass = 'bg-warning-container text-[#ad6800]';
        } else {
          statusBadge = '已完工';
          statusClass = 'bg-gray-100 text-on-surface';
        }

        html += '<article class="bg-white rounded-xl p-4 border border-outline-variant mb-4">';
        html += '<div class="flex justify-between items-center mb-3">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="px-2 py-1 rounded text-xs font-semibold ' + statusClass + '">' + statusBadge + '</span>';
        html += '<span class="text-xs text-on-surface-variant font-mono">' + (task.orderNo || task.id) + '</span>';
        html += '</div>';
        if (task.appointmentTime) {
          html += '<span class="text-xs text-on-surface-variant">预约: ' + task.appointmentTime + '</span>';
        }
        html += '</div>';

        html += '<h3 class="font-semibold mb-3" style="color: #111827;">' + (task.faultType || '维修任务') + '</h3>';

        html += '<div class="space-y-2 text-sm text-on-surface-variant mb-4">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">devices</span>';
        html += '<span>' + (task.device ? task.device.model : '-') + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">person</span>';
        html += '<span>' + (task.customer ? task.customer.name : '-') + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">location_on</span>';
        html += '<span>' + addr + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<div class="flex justify-between items-center pt-3 border-t border-outline-variant">';
        html += '<div class="text-xs text-on-surface-variant">';
        html += '<span class="material-symbols-outlined text-sm" style="vertical-align: middle;">person</span> ';
        html += (task.customer ? task.customer.name : '-') + ' - ' + (task.customer ? task.customer.phone : '-');
        html += '</div>';

        if (currentTab === 'pending') {
          html += '<button class="px-4 py-2 text-white text-sm font-medium rounded-lg" style="background-color: #006d33;" onclick="startWork(\'' + task.id + '\')">开始打卡</button>';
        } else {
          html += '<button class="px-4 py-2 border text-sm font-medium rounded-lg" style="border-color: #006d33; color: #006d33;" onclick="viewDetail(\'' + task.id + '\')">查看详情</button>';
        }
        html += '</div>';
        html += '</article>';
      });

      container.innerHTML = html;
    }

    function startWork(orderId) {
      fetch(API_BASE + '/engineer/orders/' + orderId + '/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        alert('已开始作业');
        window.location.href = 'tasks.html';
      })
      .catch(function(err) {
        alert('操作失败: ' + err.message);
      });
    }

    function viewDetail(orderId) {
      window.location.href = 'task-detail.html#' + orderId;
    }
  </script>
</body>
</html>
