<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>
<link rel="stylesheet" href="/workspace-experience.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的 - 工程师端</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <link href="/fonts/main.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006d33",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "on-surface": "#191c1e"
          }
        }
      }
    }
  </script>
<link rel="stylesheet" href="/product-design.css?v=1"><script src="/mobile-navigation.js" defer></script><link rel="stylesheet" href="/mobile-continuity.css"><script src="/mobile-continuity.js" defer></script><link rel="stylesheet" href="/visual-gallery.css"><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><link rel="stylesheet" href="/brand/brand.css"><link rel="stylesheet" href="/engineer-visuals.css"><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><link rel="stylesheet" href="/engineer-refined.css"><link rel="stylesheet" href="/engineer-interaction.css"><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin></head>
<body class="product-screen bg-surface pb-20 mobile-system" data-role="engineer" data-refined="true" data-page="profile">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="w-10"></div>
    <h1 class="font-semibold text-base" style="color: #111827;">我的</h1>
    <span class="w-10" aria-hidden="true"></span>
  </header>

  <!-- Main Content -->
  <main class="pt-14 px-4 space-y-4">
    <section data-engineer-companies aria-live="polite" aria-label="所属企业" style="background:#f0f8f3;border:1px solid #d5e8dc;border-radius:12px;padding:14px 16px;margin-top:16px"><p style="margin:0;font-size:14px;color:#52665a">正在核实所属企业…</p></section>
    <!-- Profile Header -->
    <div id="engineerProfileHeader" class="field-profile-card bg-white rounded-xl p-5 border border-outline-variant flex items-center gap-4 mt-4">
      <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center">
        <span class="material-symbols-outlined fill text-3xl" style="color: #006d33;">person</span>
      </div>
      <div class="flex-1">
        <div class="font-semibold text-lg" id="engineerName" style="color: #111827;">工程师</div>
        <div class="text-sm text-on-surface-variant" id="engineerPhone">-</div>
        <p class="profile-maintenance-note">企业管理的工作账号</p>
      </div>

    </div>

    <section id="engineerAvailability" class="profile-availability" aria-labelledby="availabilityTitle">
      <div class="availability-heading"><h2 id="availabilityTitle">工作状态</h2><span id="availabilityCurrent" aria-live="polite">读取中</span></div>
      <div class="availability-control" role="group" aria-label="选择工作状态">
        <button type="button" class="status-btn" data-status="ONLINE" aria-pressed="false" onclick="updateStatus('ONLINE')">可接单</button>
        <button type="button" class="status-btn" data-status="WORKING" aria-pressed="false" onclick="updateStatus('WORKING')">服务中</button>
        <button type="button" class="status-btn" data-status="OFFLINE" aria-pressed="false" onclick="updateStatus('OFFLINE')">休息中</button>
      </div>
      <div id="statusFeedback" class="profile-feedback" role="status">正在读取工作状态…</div>
      <button type="button" class="availability-retry" onclick="loadStatus()" hidden>重新读取</button>
    </section>

    <div id="statsFeedback" class="profile-feedback" role="status" hidden>收益暂时无法读取。<button type="button" onclick="loadStats()">重新加载收益</button></div>
    <section id="engineerIncome" class="field-income-card cursor-pointer" role="link" tabindex="0" aria-label="查看收益明细" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="window.location.href='stats.html'">
      <div class="income-heading"><h2>本月服务</h2><span>收益明细 <span aria-hidden="true">↗</span></span></div>
      <div class="income-values">
        <div><span class="income-label">本月收益 · 元</span><strong id="monthlyRevenue">—</strong></div>
        <div><span class="income-label">本月订单 · 单</span><strong id="monthlyOrders">—</strong></div>
      </div>
    </section>

    <!-- Menu List -->
    <div class="bg-white rounded-xl border border-outline-variant overflow-hidden">
      <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition-colors border-b border-outline-variant" onclick="window.location.href='history.html'">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined" style="color: #006d33;">history</span>
          <span class="text-sm font-medium" style="color: #111827;">历史订单</span>
        </div>
        <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
      </button>


    </div>
    <section class="field-account-links"><h2>服务与资质</h2><a href="market-profile.html">接单资料与审核</a><a href="ai-assistant.html">维修 AI 助手</a></section>
    <button type="button" class="field-logout" onclick="logout()">退出登录</button>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <a href="grab.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">bolt</span>
      <span class="nav-label">抢单</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">assignment</span>
      <span class="nav-label">任务</span>
    </a>
    <a href="ai-assistant.html" class="nav-item" style="margin-top: -12px;">
      <img src="ai-icon.png" alt="AI" style="width: 77px; height: 77px; object-fit: contain;">
    </a>
    <a href="inventory.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">inventory_2</span>
      <span class="nav-label">移动仓</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="material-symbols-outlined fill nav-icon">person</span>
      <span class="nav-label">我的</span>
    </a>
  </nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');
    var user = null;

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', async function() {
      loadProfile();
      try {
        const workspace = await window.EngineerWorkspace.ready();
        if (workspace?.platform) {
          document.querySelector('.profile-maintenance-note').textContent = '平台合作工程师：接单资料与技能资质由平台审核。';
          document.getElementById('engineerAvailability').hidden = true;
          document.getElementById('statusFeedback').hidden = true;
          document.querySelector('button[onclick="loadStatus()"]').hidden = true;
          document.getElementById('monthlyRevenue').closest('.cursor-pointer').hidden = true;
          document.querySelectorAll('[onclick*="stats.html"],[onclick*="history.html"],[onclick*="inventory.html"],a[href="inventory.html"],a[href="ai-assistant.html"]').forEach(el => el.hidden = true);
          return;
        }
      } catch { return; }
      loadStats();
      loadStatus();
    });

    var statusBusy=false;
    function paintStatus(status){
      var labels={ONLINE:'可接单',WORKING:'服务中',OFFLINE:'休息中'};
      document.getElementById('availabilityCurrent').textContent=labels[status]||'状态待确认';
      document.getElementById('engineerAvailability').dataset.status=status||'UNKNOWN';
      document.querySelectorAll('.status-btn').forEach(function(btn){var active=btn.dataset.status===status;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));});
    }
    async function loadStatus(){try{var response=await fetch(API_BASE+'/engineer/status',{headers:{Authorization:'Bearer '+token}});var data=await readApiResponse(response);paintStatus(data.status);document.querySelector('button[onclick="loadStatus()"]').hidden=true;document.getElementById('statusFeedback').dataset.state='synced';document.getElementById('statusFeedback').textContent='';}catch(e){paintStatus(null);document.querySelector('button[onclick="loadStatus()"]').hidden=false;document.getElementById('statusFeedback').dataset.state='error';document.getElementById('statusFeedback').textContent='当前接单状态未能读取，请重试：'+e.message;}}
    function loadProfile() {
      try {
        user = JSON.parse(localStorage.getItem('engineer_user'));
        if (user) {
          document.getElementById('engineerName').textContent = user.name || '工程师';
          document.getElementById('engineerPhone').textContent = user.phone || '-';
        }
      } catch (e) {}
    }

    function loadStats() {
      fetch(API_BASE + '/engineer/stats', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        document.getElementById('statsFeedback').hidden=true;
        document.getElementById('monthlyRevenue').textContent = Number(data.monthlyRevenue || 0).toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2});
        document.getElementById('monthlyOrders').textContent = (data.monthlyOrders || 0);
      })
      .catch(function(err) {
        document.getElementById('monthlyRevenue').textContent='待核实';document.getElementById('monthlyOrders').textContent='待核实';document.getElementById('statsFeedback').hidden=false;
      });
    }

    async function updateStatus(status){
      if(statusBusy || document.querySelector('.status-btn[data-status="'+status+'"]')?.getAttribute('aria-pressed')==='true')return;statusBusy=true;
      document.querySelectorAll('.status-btn').forEach(function(btn){btn.disabled=true;});
      document.getElementById('statusFeedback').dataset.state='pending';document.getElementById('statusFeedback').textContent='正在保存接单状态…';
      try{var response=await fetch(API_BASE+'/engineer/status',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status:status})});await readApiResponse(response);await loadStatus();}
      catch(e){paintStatus(null);document.querySelector('button[onclick="loadStatus()"]').hidden=false;document.getElementById('statusFeedback').dataset.state='error';document.getElementById('statusFeedback').textContent='未能确认保存结果，请重新读取当前状态后再操作：'+e.message;}
      finally{statusBusy=false;document.querySelectorAll('.status-btn').forEach(function(btn){btn.disabled=false;});}
    }

    function logout() {
      if (!confirm('确定要退出登录吗？')) return;
      localStorage.removeItem('engineer_token');
      localStorage.removeItem('engineer_user');
      window.location.href = 'login.html';
    }
  </script>
<script src="/iot/entry.js" defer></script></body>
</html>
