<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>提交报价 - 工程师端 · 智修工</title>





<script src="/mobile-continuity.js" defer></script><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><script src="/engineer-navigation.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-f272a24017e1.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-24 mobile-system" data-role="engineer" data-refined="true" data-page="quote">
  <!-- Top App Bar -->
  <header class="engineer-page-header"><a class="engineer-back" href="platform-orders.html" aria-label="返回上一页"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="engineer-header-title">提交报价</h1><span class="engineer-header-space" aria-hidden="true"></span></header>

  <!-- Main Content -->
  <main class="pt-14 px-4 pb-24 space-y-4">
    <!-- 工单信息 -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant mt-4">
      <h3 class="font-semibold mb-4" style="color: #111827;">工单信息</h3>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between">
          <span class="text-on-surface-variant">工单号</span>
          <span class="font-mono" id="orderNo">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">故障类型</span>
          <span id="faultType">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-on-surface-variant">客户</span>
          <span id="customerName">-</span>
        </div>
      </div>
    </div>

    <div id="contractBenefit" class="hidden rounded-xl p-4 text-sm" style="background:#e9f7ee;color:#26734c"></div>
    <!-- 费用明细 -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant">
      <h3 class="font-semibold mb-4" style="color: #111827;">费用明细</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">配件费用 (¥)</label>
          <input type="number" id="partsFee" value="0" min="0" step="0.01"
            class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:border-primary"
            style="border-color: var(--outline-variant);"
            oninput="feeEdited=true;calculateTotal()">
        </div>
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">人工费用 (¥)</label>
          <input type="number" id="laborFee" value="0" min="0" step="0.01"
            class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:border-primary"
            style="border-color: var(--outline-variant);"
            oninput="feeEdited=true;calculateTotal()">
        </div>
      </div>

      <div class="mt-4 p-4 rounded-xl" style="background-color: #f7f9fb;">
        <div class="flex justify-between text-sm mb-2">
          <span class="text-on-surface-variant">配件费用</span>
          <span id="partsFeeDisplay">¥0.00</span>
        </div>
        <div class="flex justify-between text-sm mb-2">
          <span class="text-on-surface-variant">人工费用</span>
          <span id="laborFeeDisplay">¥0.00</span>
        </div>
        <div class="flex justify-between text-lg font-bold pt-3 border-t border-outline-variant mt-3">
          <span>总价</span>
          <span style="color: #006d33;" id="totalAmount">¥0.00</span>
        </div>
      </div>

      <div class="mt-4 p-3 rounded-lg" style="background-color: #fffbe6; border: 1px solid #ffe58f;">
        <p class="text-sm" style="color: #ad6800;">
          💡 客户需支付 30% 定金（¥<span id="depositAmount">0.00</span>）后方可开始维修
        </p>
      </div>
    </div>
  </main>

  <!-- Bottom Action -->
  <div class="fixed bottom-0 w-full max-w-[414px] bg-white border-t border-outline-variant px-4 py-4 z-40">
    <button id="submitBtn" disabled class="engineer-primary w-full py-3 text-white font-medium rounded-lg" style="background-color: #006d33;" onclick="submitQuote()">
      提交报价
    </button>
  </div>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');
    var orderId = null;
    var orderData = null;
    var feeEdited = false;

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      orderId = window.location.hash.slice(1);
      if (!orderId) {
        window.EngineerFeedback.show('缺少工单编号，请从工单列表重新进入。');
        return;
      }
      loadOrderInfo();
    });

    function loadOrderInfo() {
      orderData=null;document.getElementById('submitBtn').disabled=true;
      window.EngineerFeedback.show('正在读取工单信息…','loading');
      return fetch(API_BASE + '/engineer/orders/' + orderId, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        orderData = data;
        window.EngineerFeedback.clear();document.getElementById('submitBtn').disabled=false;
        if (data.contractTerms) {
          var benefit = document.getElementById('contractBenefit'); benefit.classList.remove('hidden');
          benefit.textContent = '合同 ' + data.contractTerms.number + '：' + (data.contractTerms.laborIncluded ? '人工费已包含' : '人工费另计') + '，配件按原价 ' + Number(data.contractTerms.partsDiscount) + '% 结算。下方输入原价，合计自动应用权益。';
        }
        calculateTotal();
        document.getElementById('orderNo').textContent = data.orderNo || data.id;
        document.getElementById('faultType').textContent = data.faultType || '-';
        document.getElementById('customerName').textContent = data.customer ? data.customer.name : '-';

        if (!feeEdited) document.getElementById('partsFee').value = data.partsFee || 0;
        if (!feeEdited) document.getElementById('laborFee').value = data.laborFee || 0;
        calculateTotal();
      })
      .catch(function(err) {
        window.EngineerFeedback.show('任务暂时无法读取：'+err.message+'。请重新加载后再操作。','error',loadOrderInfo);
      });
    }

    function calculateTotal() {
      var partsFee = parseFloat(document.getElementById('partsFee').value) || 0;
      var laborFee = parseFloat(document.getElementById('laborFee').value) || 0;
      var appliedParts = partsFee * Number(orderData?.contractTerms?.partsDiscount ?? 100) / 100;
      var appliedLabor = orderData?.contractTerms?.laborIncluded ? 0 : laborFee;
      var total = Math.round((appliedParts + appliedLabor) * 100) / 100;
      var deposit = total * 0.3;

      document.getElementById('partsFeeDisplay').textContent = '¥' + appliedParts.toFixed(2);
      document.getElementById('laborFeeDisplay').textContent = '¥' + appliedLabor.toFixed(2);
      document.getElementById('totalAmount').textContent = '¥' + total.toFixed(2);
      document.getElementById('depositAmount').textContent = deposit.toFixed(2);
    }

    function submitQuote() {
      if(!orderData){window.EngineerFeedback.show('工单信息尚未确认，请先重新加载。','error',loadOrderInfo);return;}
      var partsFee = parseFloat(document.getElementById('partsFee').value) || 0;
      var laborFee = parseFloat(document.getElementById('laborFee').value) || 0;
      var total = partsFee + laborFee;

      if (total <= 0 && !orderData?.contractTerms) {
        window.EngineerFeedback.notice('请输入有效的费用');
        return;
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;btn.setAttribute("aria-busy","true");
      btn.textContent = '提交中...';

      fetch(API_BASE + '/engineer/orders/' + orderId + '/quote', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          partsFee: partsFee,
          laborFee: laborFee
        })
      })
      .then(window.readApiResponse)
      .then(function(data) {
        window.EngineerFeedback.show('报价已提交，等待客户确认','success');
        window.location.href = 'tasks.html';
      })
      .catch(function(err) {
        btn.disabled = false;btn.removeAttribute("aria-busy");
        btn.textContent = '提交报价';
        window.EngineerFeedback.show('报价提交失败：'+err.message+'。已保留填写内容，请重试。');
      });
    }
  </script>
</body>
</html>
