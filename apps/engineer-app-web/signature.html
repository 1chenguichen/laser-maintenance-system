<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>完工签字 - 工程师端 · 智修工</title>



  <link rel="stylesheet" href="/styles/bundled/layout-7e7c7215e4e5.css">
  <style>
    .signature-canvas-wrapper {
      border: 2px dashed var(--outline-variant);
      border-radius: 12px;
      background: #fff;
      margin-top: 12px;
    }
    #signatureCanvas {
      width: 100%;
      height: 200px;
      display: block;
      touch-action: none;
    }
  </style>
<script src="/mobile-continuity.js" defer></script><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><script src="/engineer-navigation.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-28c9a3df5091.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-24 mobile-system" data-role="engineer" data-refined="true" data-page="signature">
  <!-- Top App Bar -->
  <header class="engineer-page-header"><a class="engineer-back" href="platform-orders.html" aria-label="返回上一页"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="engineer-header-title">维修签名</h1><span class="engineer-header-space" aria-hidden="true"></span></header>

  <!-- Main Content -->
  <main class="pt-14 px-4 space-y-4">
    <!-- Order Summary -->
    <div id="orderSummary" class="bg-white rounded-xl p-4 border border-outline-variant mt-4">
      <div class="text-center py-4 text-on-surface-variant">加载中...</div>
    </div>

    <!-- Signature Section -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant">
      <h3 class="font-semibold mb-2" style="color: #111827;">客户签字确认</h3>
      <p class="text-xs text-on-surface-variant mb-4">请让客户在下方区域签字确认维修完成</p>

      <div class="signature-canvas-wrapper">
        <canvas id="signatureCanvas"></canvas>
      </div>

      <div class="flex gap-3 mt-4">
        <button class="flex-1 py-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-2" style="border-color: #006d33; color: #006d33;" onclick="clearSignature()">
          <span class="material-symbols-outlined text-lg">refresh</span>
          重写
        </button>
      </div>

      <div class="flex items-center gap-2 mt-4 text-xs" style="color: #ff4d4f;">
        <span class="material-symbols-outlined text-lg">info</span>
        签字代表客户确认维修已完成并认可维修结果
      </div>
    </div>
  </main>

  <!-- Bottom Action -->
  <div class="fixed bottom-0 w-full max-w-[414px] bg-white border-t border-outline-variant px-4 py-4 z-40">
    <button id="submitBtn" disabled class="engineer-primary w-full py-3 text-white font-medium rounded-lg flex items-center justify-center gap-2" style="background-color: #006d33;" onclick="submitComplete()">
      <span class="material-symbols-outlined">done</span>
      确认完工
    </button>
  </div>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');
    var orderId = null;
    var orderData = null;
    var signatureData = null;
    var canvas, ctx;
    var isDrawing = false;
    var lastX = 0, lastY = 0;

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      orderId = window.location.hash.slice(1);
      if (!orderId) {
        window.EngineerFeedback.show('缺少工单编号，请从工单列表重新进入。');
        return;
      }
      loadOrder();
      initCanvas();
    });

    function loadOrder() {
      orderData=null;document.getElementById('submitBtn').disabled=true;
      window.EngineerFeedback.show('正在读取工单信息…','loading');
      return fetch(API_BASE + '/engineer/orders/' + orderId, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        orderData = data;
        renderSummary(data);window.EngineerFeedback.clear();document.getElementById('submitBtn').disabled=false;
      })
      .catch(function(err) {
        document.getElementById('orderSummary').textContent='工单信息尚未确认';window.EngineerFeedback.show('任务暂时无法读取：'+err.message+'。请重新加载后再操作。','error',loadOrder);
      });
    }

    function renderSummary(order) {
      var total = (Number(order.partsFee) || 0) + (Number(order.laborFee) || 0);
      var html = '';
      html += '<h3 class="font-semibold mb-4" style="color: #111827;">维修结算</h3>';
      html += '<div class="space-y-3 text-sm">';
      html += '<div class="flex justify-between">';
      html += '<span class="text-on-surface-variant">配件费</span>';
      html += '<span class="font-medium">¥' + (Number(order.partsFee) || 0).toFixed(2) + '</span>';
      html += '</div>';
      html += '<div class="flex justify-between">';
      html += '<span class="text-on-surface-variant">人工费</span>';
      html += '<span class="font-medium">¥' + (Number(order.laborFee) || 0).toFixed(2) + '</span>';
      html += '</div>';
      html += '<div class="flex justify-between">';
      html += '<span class="text-on-surface-variant">维修设备</span>';
      html += '<span class="font-medium">' + (order.device ? order.device.model : '-') + '</span>';
      html += '</div>';
      html += '</div>';
      html += '<div class="flex justify-between items-center mt-4 pt-4 border-t border-outline-variant">';
      html += '<span class="font-semibold">合计费用</span>';
      html += '<span class="text-xl font-bold" style="color: #006d33;">¥' + total.toFixed(2) + '</span>';
      html += '</div>';
      document.getElementById('orderSummary').innerHTML = html;
    }

    function initCanvas() {
      canvas = document.getElementById('signatureCanvas');
      ctx = canvas.getContext('2d');

      var wrapper = canvas.parentElement;
      canvas.width = wrapper.clientWidth;
      canvas.height = 200;

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);

      canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function getTouchPos(e) {
      var rect = canvas.getBoundingClientRect();
      var touch = e.touches[0];
      return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
      };
    }

    function handleTouchStart(e) {
      e.preventDefault();
      var pos = getTouchPos(e);
      isDrawing = true;
      lastX = pos.x;
      lastY = pos.y;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (!isDrawing) return;
      var pos = getTouchPos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    }

    function startDrawing(e) {
      isDrawing = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
    }

    function draw(e) {
      if (!isDrawing) return;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      lastX = e.offsetX;
      lastY = e.offsetY;
    }

    function stopDrawing() {
      isDrawing = false;
      if (canvas) {
        signatureData = canvas.toDataURL('image/png');
      }
    }

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      signatureData = null;
    }

    function submitComplete() {
      if (!orderData) { window.EngineerFeedback.notice('工单数据尚未加载，请稍后重试'); return; }
      if (!signatureData) {
        window.EngineerFeedback.notice('请让客户签字确认');
        return;
      }

      var submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;submitBtn.setAttribute("aria-busy","true");
      submitBtn.innerHTML = '<span class="material-symbols-outlined">hourglass_empty</span>提交中...';

      fetch(API_BASE + '/engineer/orders/' + orderId + '/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          partsFee: Number(orderData.partsFee) || 0,
          laborFee: Number(orderData.laborFee) || 0,
          signatureUrl: signatureData
        })
      })
      .then(window.readApiResponse)
      .then(function(data) {
        window.EngineerFeedback.show('完工确认成功','success');
        // 跳转到 working tab
        window.location.href = 'tasks.html#working';
      })
      .catch(function(err) {
        window.EngineerFeedback.show('完工提交失败：'+err.message+'。已保留签名，请重试。');
        submitBtn.disabled = false;submitBtn.removeAttribute("aria-busy");
        submitBtn.innerHTML = '<span class="material-symbols-outlined">done</span>确认完工';
      });
    }
  </script>
</body>
</html>
