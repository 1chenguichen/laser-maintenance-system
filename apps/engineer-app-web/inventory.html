<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>移动仓 - 工程师端</title>
  <script src="/tailwind.js"></script>
  <link href="/fonts/material-symbols.css" rel="stylesheet">
  <link href="/fonts/main.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006d33",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "on-surface": "#191c1e"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface pb-20">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="w-10"></div>
    <h1 class="font-semibold text-base" style="color: #111827;">移动仓</h1>
    <div class="w-10"></div>
  </header>

  <!-- Main Content -->
  <main class="pt-14 px-4 space-y-4">
    <!-- Quick Stats -->
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div class="bg-white rounded-xl p-4 border border-outline-variant text-center">
        <div class="text-2xl font-bold" style="color: #006d33;">0</div>
        <div class="text-xs text-on-surface-variant mt-1">配件种类</div>
      </div>
      <div class="bg-white rounded-xl p-4 border border-outline-variant text-center">
        <div class="text-2xl font-bold">0</div>
        <div class="text-xs text-on-surface-variant mt-1">可用数量</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant">
      <h3 class="font-semibold mb-2" style="color: #111827;">配件申领</h3>
      <p class="text-xs text-on-surface-variant mb-3">当库存不足时，可以向仓库申领配件</p>
      <button class="w-full py-3 text-white font-medium rounded-lg flex items-center justify-center gap-2" style="background-color: #006d33;" onclick="alert('功能开发中')">
        <span class="material-symbols-outlined">add</span>
        申领配件
      </button>
    </div>

    <!-- Inventory List -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold" style="color: #111827;">库存明细</h3>
        <button class="px-3 py-1.5 border rounded-lg text-xs flex items-center gap-1" style="border-color: #006d33; color: #006d33;" onclick="refreshInventory()">
          <span class="material-symbols-outlined text-sm">refresh</span>
          刷新
        </button>
      </div>

      <div id="inventoryList">
        <div class="text-center py-8">
          <span class="material-symbols-outlined text-5xl text-on-surface-variant">inventory_2</span>
          <p class="mt-4 text-sm text-on-surface-variant">暂无配件库存记录</p>
          <p class="text-xs text-on-surface-variant mt-1">您还没有申领任何配件</p>
        </div>
      </div>
    </div>

    <!-- Transfer Request -->
    <div class="bg-white rounded-xl p-4 border border-outline-variant">
      <h3 class="font-semibold mb-2" style="color: #111827;">物料调拨申请</h3>
      <p class="text-xs text-on-surface-variant mb-3">需要从其他工程师调拨配件时使用</p>
      <button class="w-full py-3 border font-medium rounded-lg flex items-center justify-center gap-2" style="border-color: #006d33; color: #006d33;" onclick="alert('功能开发中')">
        <span class="material-symbols-outlined">swap_horiz</span>
        发起调拨申请
      </button>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <a href="grab.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">bolt</span>
      <span class="nav-label">抢单</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">assignment</span>
      <span class="nav-label">任务</span>
    </a>
    <a href="ai-assistant.html" class="nav-item" style="margin-top: -12px;">
      <img src="ai-icon.png" alt="AI" style="width: 77px; height: 77px; object-fit: contain;">
    </a>
    <a href="inventory.html" class="nav-item active">
      <span class="material-symbols-outlined fill nav-icon">inventory_2</span>
      <span class="nav-label">移动仓</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">person</span>
      <span class="nav-label">我的</span>
    </a>
  </nav>

  <script>
    var API_BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    var token = localStorage.getItem('engineer_token');

    if (!token) {
      window.location.href = 'login.html';
    }

    function refreshInventory() {
      document.getElementById('inventoryList').innerHTML = '<div class="text-center py-8"><span class="material-symbols-outlined text-5xl text-on-surface-variant">hourglass_empty</span><p class="mt-4 text-sm text-on-surface-variant">加载中...</p></div>';
      setTimeout(function() {
        document.getElementById('inventoryList').innerHTML = '<div class="text-center py-8"><span class="material-symbols-outlined text-5xl text-on-surface-variant">inventory_2</span><p class="mt-4 text-sm text-on-surface-variant">暂无配件库存记录</p></div>';
      }, 500);
    }
  </script>
</body>
</html>
