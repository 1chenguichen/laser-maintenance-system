<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工单大厅 - 工程师端 · 智修工</title>





<script src="/mobile-navigation.js" defer></script><script src="/mobile-continuity.js" defer></script><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><script src="/engineer-navigation.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-dc01e7ce4e58.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-20 mobile-system" data-role="engineer" data-refined="true" data-page="grab">
  <!-- Top App Bar -->
  <header class="engineer-page-header"><a class="engineer-back" href="opportunities.html" aria-label="返回上一页"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="engineer-header-title">企业派单</h1><span class="engineer-header-space" aria-hidden="true"></span></header>

  <!-- Filter Chips -->
  <div class="fixed top-14 w-full z-40 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="flex gap-2 px-4 py-3 overflow-x-auto">
      <button class="filter-chip active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="all">全部工单</button>
      <button class="filter-chip px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="urgent">紧急故障</button>
      <button class="filter-chip px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="reserved">预约维保</button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="pt-28 px-4 space-y-4">
    <div id="orderList">
      <div class="text-center py-12 text-on-surface-variant">加载中...</div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="mobile-navigation" aria-label="主要导航"><a href="workbench.html"><span class="material-symbols-outlined" aria-hidden="true">home</span><span>工作台</span></a><a href="opportunities.html"><span class="material-symbols-outlined" aria-hidden="true">bolt</span><span>接单</span></a><a href="platform-orders.html"><span class="material-symbols-outlined" aria-hidden="true">assignment</span><span>工单</span></a><a href="learning.html"><span class="material-symbols-outlined" aria-hidden="true">school</span><span>学习</span></a><a href="profile.html"><span class="material-symbols-outlined" aria-hidden="true">person</span><span>我的</span></a></nav>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');
    var currentFilter = 'all';
    var orders = [];

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadOrders();
      setupFilterChips();
      // 每10秒自动刷新工单池
      setInterval(loadOrders, 3000);
    });

    function setupFilterChips() {
      document.querySelectorAll('.filter-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('.filter-chip').forEach(function(c) {
            c.classList.remove('active');
            c.style.backgroundColor = '#ffffff';
            c.style.color = '#191c1e';
            c.style.borderColor = '#c3c6d1';
          });
          this.classList.add('active');
          this.style.backgroundColor = '#006d33';
          this.style.color = '#ffffff';
          this.style.borderColor = '#006d33';
          currentFilter = this.dataset.filter;
          renderOrders();
        });
      });
      // Init first chip style
      document.querySelector('.filter-chip.active').style.backgroundColor = '#006d33';
      document.querySelector('.filter-chip.active').style.color = '#ffffff';
      document.querySelector('.filter-chip.active').style.borderColor = '#006d33';
    }

    function loadOrders() {
      fetch(API_BASE + '/engineer/grab-pool', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        orders = Array.isArray(data) ? data : [];
        renderOrders();
      })
      .catch(function(err) {
        document.getElementById('orderList').innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载失败: ' + err.message + '</div>';
      });
    }

    function renderOrders() {
      var container = document.getElementById('orderList');

      var filtered = orders.filter(function(order) {
        if (currentFilter === 'urgent') return order.emergencyLevel >= 3;
        if (currentFilter === 'reserved') return order.dispatchType === 'DESIGNATED';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-12">' +
          '<span class="material-symbols-outlined text-5xl text-on-surface-variant">inbox</span>' +
          '<p class="mt-4 text-on-surface-variant">暂无工单</p></div>';
        return;
      }

      var html = '';
      filtered.forEach(function(order) {
        var isUrgent = order.emergencyLevel >= 3;
        var isDesignated = order.dispatchType === 'DESIGNATED';
        var cardClass = isUrgent ? 'border-l-4 border-l-error' : '';
        var badgeClass = isUrgent ? 'bg-error-container text-error' : isDesignated ? 'bg-[#e8f0fe] text-[#001e40]' : 'bg-gray-100 text-on-surface';
        var badgeText = isUrgent ? '紧急' : isDesignated ? '预约' : '常规';
        var addr = order.address ? [order.address.city, order.address.district, order.address.detail].filter(Boolean).join('') : '-';

        html += '<article class="bg-white rounded-xl p-4 border border-outline-variant ' + cardClass + '">';
        html += '<div class="flex justify-between items-start mb-3">';
        html += '<div class="flex flex-col gap-2">';
        html += '<h3 class="font-semibold" style="color: #111827;">' + (order.device ? order.device.model : '设备维修') + '</h3>';
        html += '<span class="inline-block px-2 py-1 rounded text-xs font-semibold ' + badgeClass + '">' + badgeText + '</span>';
        html += '</div>';
        html += '<div class="text-xl font-bold" style="color: #006d33;">¥' + (parseFloat(order.estimatedAmount) || 0).toFixed(0) + '</div>';
        html += '</div>';

        html += '<div class="space-y-2 text-sm text-on-surface-variant mb-4">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">warning</span>';
        html += '<span class="break-all">' + (order.faultType || '故障') + (order.faultDescription ? ' - ' + order.faultDescription : '') + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">location_on</span>';
        html += '<span>' + addr + (order.distance ? ' · 距离 ' + order.distance + 'km' : '') + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<button class="engineer-primary w-full py-3 text-white font-medium rounded-lg" style="background-color: #006d33;" onclick="grabOrder(\'' + order.id + '\')">';
        html += '立即抢单';
        html += '</button>';
        html += '</article>';
      });

      container.innerHTML = html;
    }

    async function grabOrder(orderId) {
      if (!(await window.EngineerFeedback.confirm('确定要抢单吗？'))) return;

      fetch(API_BASE + '/engineer/grab', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ workOrderId: orderId })
      })
      .then(window.readApiResponse)
      .then(function(data) {
        if (data.id || data.status === 'DISPATCHED') {
          window.EngineerFeedback.show('抢单成功！','success');
          window.location.href = 'tasks.html';
        } else {
          window.EngineerFeedback.notice(data.message || '抢单失败');
        }
      })
      .catch(function(err) {
        window.EngineerFeedback.notice('抢单失败: ' + err.message);
      });
    }
  </script>
</body>
</html>
