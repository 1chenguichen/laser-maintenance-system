<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>工单大厅 - 工程师端</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006d33",
            "on-primary": "#ffffff",
            "surface": "#f7f9fb",
            "on-surface": "#191c1e"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface pb-20">
  <!-- Top App Bar -->
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="w-10"></div>
    <h1 class="font-semibold text-base" style="color: #111827;">工单大厅</h1>
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100">
      <span class="material-symbols-outlined" style="color: #006d33;">notifications</span>
    </button>
  </header>

  <!-- Filter Chips -->
  <div class="fixed top-14 w-full z-40 bg-white border-b border-outline-variant max-w-[414px]">
    <div class="flex gap-2 px-4 py-3 overflow-x-auto">
      <button class="filter-chip active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="all">全部工单</button>
      <button class="filter-chip px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="urgent">紧急故障</button>
      <button class="filter-chip px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-filter="reserved">预约维保</button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="pt-28 px-4 space-y-4">
    <div id="orderList">
      <div class="text-center py-12 text-on-surface-variant">加载中...</div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white border-t border-outline-variant max-w-[414px]">
    <a href="grab.html" class="nav-item active">
      <span class="material-symbols-outlined fill nav-icon">bolt</span>
      <span class="nav-label">抢单</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">assignment</span>
      <span class="nav-label">任务</span>
    </a>
    <a href="ai-assistant.html" class="nav-item" style="margin-top: -12px;">
      <img src="ai-icon.png" alt="AI" style="width: 77px; height: 77px; object-fit: contain;">
    </a>
    <a href="inventory.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">inventory_2</span>
      <span class="nav-label">移动仓</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="material-symbols-outlined nav-icon">person</span>
      <span class="nav-label">我的</span>
    </a>
  </nav>

  <script>
    var API_BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
    var token = localStorage.getItem('engineer_token');
    var currentFilter = 'all';
    var orders = [];

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadOrders();
      setupFilterChips();
      // 每10秒自动刷新工单池
      setInterval(loadOrders, 3000);
    });

    function setupFilterChips() {
      document.querySelectorAll('.filter-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('.filter-chip').forEach(function(c) {
            c.classList.remove('active');
            c.style.backgroundColor = '#ffffff';
            c.style.color = '#191c1e';
            c.style.borderColor = '#c3c6d1';
          });
          this.classList.add('active');
          this.style.backgroundColor = '#006d33';
          this.style.color = '#ffffff';
          this.style.borderColor = '#006d33';
          currentFilter = this.dataset.filter;
          renderOrders();
        });
      });
      // Init first chip style
      document.querySelector('.filter-chip.active').style.backgroundColor = '#006d33';
      document.querySelector('.filter-chip.active').style.color = '#ffffff';
      document.querySelector('.filter-chip.active').style.borderColor = '#006d33';
    }

    function loadOrders() {
      fetch(API_BASE + '/engineer/grab-pool', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        orders = Array.isArray(data) ? data : [];
        renderOrders();
      })
      .catch(function(err) {
        document.getElementById('orderList').innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载失败: ' + err.message + '</div>';
      });
    }

    function renderOrders() {
      var container = document.getElementById('orderList');

      var filtered = orders.filter(function(order) {
        if (currentFilter === 'urgent') return order.emergencyLevel >= 3;
        if (currentFilter === 'reserved') return order.dispatchType === 'DESIGNATED';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-12">' +
          '<span class="material-symbols-outlined text-5xl text-on-surface-variant">inbox</span>' +
          '<p class="mt-4 text-on-surface-variant">暂无工单</p></div>';
        return;
      }

      var html = '';
      filtered.forEach(function(order) {
        var isUrgent = order.emergencyLevel >= 3;
        var isDesignated = order.dispatchType === 'DESIGNATED';
        var cardClass = isUrgent ? 'border-l-4 border-l-error' : '';
        var badgeClass = isUrgent ? 'bg-error-container text-error' : isDesignated ? 'bg-[#e8f0fe] text-[#001e40]' : 'bg-gray-100 text-on-surface';
        var badgeText = isUrgent ? '紧急' : isDesignated ? '预约' : '常规';
        var addr = order.address ? [order.address.city, order.address.district, order.address.detail].filter(Boolean).join('') : '-';

        html += '<article class="bg-white rounded-xl p-4 border border-outline-variant ' + cardClass + '">';
        html += '<div class="flex justify-between items-start mb-3">';
        html += '<div class="flex flex-col gap-2">';
        html += '<h3 class="font-semibold" style="color: #111827;">' + (order.device ? order.device.model : '设备维修') + '</h3>';
        html += '<span class="inline-block px-2 py-1 rounded text-xs font-semibold ' + badgeClass + '">' + badgeText + '</span>';
        html += '</div>';
        html += '<div class="text-xl font-bold" style="color: #006d33;">¥' + (parseFloat(order.estimatedAmount) || 0).toFixed(0) + '</div>';
        html += '</div>';

        html += '<div class="space-y-2 text-sm text-on-surface-variant mb-4">';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">warning</span>';
        html += '<span class="break-all">' + (order.faultType || '故障') + (order.faultDescription ? ' - ' + order.faultDescription : '') + '</span>';
        html += '</div>';
        html += '<div class="flex items-center gap-2">';
        html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">location_on</span>';
        html += '<span>' + addr + (order.distance ? ' · 距离 ' + order.distance + 'km' : '') + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<button class="w-full py-3 text-white font-medium rounded-lg" style="background-color: #006d33;" onclick="grabOrder(\'' + order.id + '\')">';
        html += '立即抢单';
        html += '</button>';
        html += '</article>';
      });

      container.innerHTML = html;
    }

    function grabOrder(orderId) {
      if (!confirm('确定要抢单吗？')) return;

      fetch(API_BASE + '/engineer/grab', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ workOrderId: orderId })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.id || data.status === 'DISPATCHED') {
          alert('抢单成功！');
          window.location.href = 'tasks.html';
        } else {
          alert(data.message || '抢单失败');
        }
      })
      .catch(function(err) {
        alert('抢单失败: ' + err.message);
      });
    }
  </script>
</body>
</html>
