<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工程师登录 - 激光设备维保 · 智修工</title>


  <link rel="stylesheet" href="/styles/bundled/layout-80b6d424a3c3.css">

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      background: linear-gradient(135deg, #006d33 0%, #07c160 100%);
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
    }
  </style>
<script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-348a6cf65736.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="flex flex-col justify-center px-6 auth-reference login-screen" data-role="engineer" data-refined="true">
  <main class="login-main">
    <header class="login-brand"><img src="/brand/zhixiugong-icon.svg" width="40" height="40" alt="智修工"><div><strong>智修工</strong><span>工程师工作台</span></div></header>
    <section class="login-intro"><p class="login-eyebrow">现场服务 · 专业履约</p><h1>欢迎回来，<br>开始今天的服务</h1><p class="login-description">使用工作手机号，登录你的服务工作台。</p></section>
    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
      <div id="organizationContext"></div>
      <label class="login-field" for="phone"><span>手机号</span><input type="tel" inputmode="tel" autocomplete="tel" id="phone" placeholder="请输入手机号" maxlength="11" value="13900000002"></label>
      <label class="login-field" for="code"><span>验证码</span><div class="login-code-row"><input type="text" inputmode="numeric" autocomplete="one-time-code" id="code" placeholder="请输入验证码" maxlength="6" value="000000"><button type="button" id="sendCodeBtn" onclick="sendCode()">获取验证码</button></div></label>
      <button type="submit" id="loginBtn">登录</button>
      <p class="login-demo">演示体验 · 已预填账号，验证码 000000</p>
    </form>
    <p class="login-bottom">首次使用？<button type="button" onclick="window.EngineerFeedback.notice('请联系企业管理员开通工程师账号')">联系企业管理员开通</button></p>
    <p class="login-legal">工作身份与服务权限由所属企业及平台管理。</p>
  </main>

  <script src="/organization-login.js"></script>
  <script>
    var API_BASE = window.APP_API_BASE;
    var organizationLogin = window.createOrganizationLogin('engineer');

    async function sendCode() {
      var btn = document.getElementById('sendCodeBtn');
      if (btn.disabled) return;
      var phone = document.getElementById('phone').value;
      if (!/^1[3-9]\d{9}$/.test(phone)) { window.EngineerFeedback.notice('请输入正确的手机号'); return; }
      btn.disabled = true;
      try {
        await organizationLogin.sendCode(phone);
      } catch (err) { btn.disabled = false; window.EngineerFeedback.notice(err.message); return; }
      btn.textContent = '60s';
      btn.disabled = true;
      var countdown = 60;
      var timer = setInterval(function() {
        countdown--;
        btn.textContent = countdown > 0 ? countdown + 's' : '获取验证码';
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
        }
      }, 1000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      await organizationLogin.login(document.getElementById('phone').value,document.getElementById('code').value);
    }
  </script>
</body>
</html>
