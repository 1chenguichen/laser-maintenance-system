<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/app-config.js"></script>
<script src="/workspace-scope.js"></script>
<script src="/workspace-experience.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>历史订单 - 工程师端 · 智修工</title>





<script src="/mobile-continuity.js" defer></script><script src="/visual-gallery.js" defer></script><script src="/visual-pages.js" defer></script><script src="/visual-media.js"></script><script src="/brand/brand.js" defer></script><script src="/engineer-visuals.js" defer></script><script src="/engineer-interaction.js" defer></script><link rel="preload" href="/fonts/material-symbols-bb6aa59135d1.woff2" as="font" type="font/woff2" crossorigin><script src="/engineer-refresh.js" defer></script><script src="/engineer-navigation.js" defer></script><link rel="stylesheet" href="/styles/bundled/layout-272a43fb56fe.css"><script src="/engineer-feedback.js" defer></script><link rel="icon" type="image/svg+xml" href="/brand/zhixiugong-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"><link rel="apple-touch-icon" href="/brand/icon-180.png"><link rel="manifest" href="/manifest.json"></head>
<body class="product-screen bg-surface pb-20 mobile-system" data-role="engineer" data-refined="true" data-page="history">
  <!-- Top App Bar -->
  <header class="engineer-page-header"><a class="engineer-back" href="profile.html" aria-label="返回上一页"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="engineer-header-title">服务记录</h1><span class="engineer-header-space" aria-hidden="true"></span></header>

  <!-- Main Content -->
  <main class="pt-14 px-4 space-y-4">
    <div id="historyList">
      <div class="text-center py-12 text-on-surface-variant">加载中...</div>
    </div>
  </main>

  <script>
    var API_BASE = window.APP_API_BASE;
    var token = localStorage.getItem('engineer_token');

    if (!token) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadHistory();
    });

    function loadHistory() {
      fetch(API_BASE + '/engineer/orders?status=COMPLETED', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(window.readApiResponse)
      .then(function(data) {
        var orders = Array.isArray(data) ? data : [];
        var container = document.getElementById('historyList');

        if (orders.length === 0) {
          container.innerHTML = '<div class="text-center py-12"><span class="material-symbols-outlined text-5xl text-on-surface-variant">history</span><p class="mt-4 text-on-surface-variant">暂无历史订单</p></div>';
          return;
        }

        var html = '';
        orders.forEach(function(order) {
          var addr = order.address ? [order.address.city, order.address.district, order.address.detail].filter(Boolean).join('') : '-';

          html += '<article class="bg-white rounded-xl p-4 border border-outline-variant mb-4">';
          html += '<div class="flex justify-between items-start mb-3 pb-3 border-b border-outline-variant">';
          html += '<div class="flex flex-col gap-2">';
          html += '<span class="px-2 py-1 rounded text-xs font-semibold bg-gray-100 text-on-surface">已完成</span>';
          html += '<span class="text-xs text-on-surface-variant font-mono">' + (order.orderNo || order.id) + '</span>';
          html += '</div>';
          html += '<div class="text-lg font-bold" style="color: #006d33;">¥' + ((order.finalAmount || order.estimatedAmount) || 0).toFixed(0) + '</div>';
          html += '</div>';

          html += '<h3 class="font-semibold mb-3" style="color: #111827;">' + (order.faultType || '维修任务') + '</h3>';

          html += '<div class="space-y-2 text-sm text-on-surface-variant mb-4">';
          html += '<div class="flex items-center gap-2">';
          html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">devices</span>';
          html += '<span>' + (order.device ? order.device.model : '-') + '</span>';
          html += '</div>';
          html += '<div class="flex items-center gap-2">';
          html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">location_on</span>';
          html += '<span>' + addr + '</span>';
          html += '</div>';
          html += '<div class="flex items-center gap-2">';
          html += '<span class="material-symbols-outlined text-sm" style="color: #006d33;">calendar_today</span>';
          html += '<span>' + (order.completedAt || order.updatedAt || '-') + '</span>';
          html += '</div>';
          html += '</div>';

          html += '<button class="w-full py-2 border font-medium rounded-lg text-sm" style="border-color: #006d33; color: #006d33;" onclick="viewDetail(\'' + order.id + '\')">查看详情</button>';
          html += '</article>';
        });

        container.innerHTML = html;
      })
      .catch(function(err) {
        document.getElementById('historyList').innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载失败: ' + err.message + '</div>';
      });
    }

    function viewDetail(orderId) {
      window.location.href = 'task-detail.html#' + orderId;
    }
  </script>
</body>
</html>
